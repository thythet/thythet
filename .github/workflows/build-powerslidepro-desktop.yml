name: Build PowerSlidePro Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-powerslidepro-desktop.yml'
      - 'tahoe79/powerslidepro-desktop/**'
      - 'tahoe79/apps/deckcraft-web/**'
      - 'tahoe79/assets/fonts/**'
      - 'tahoe79/data/books/**'
      - 'tahoe79/assets/js/powerslidepro-present-v1.js'
      - 'tahoe79/assets/powerslidepro-audience.html'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tahoe79/powerslidepro-desktop
            tahoe79/apps/deckcraft-web
            tahoe79/assets/fonts
            tahoe79/data/books
            tahoe79/assets/js/powerslidepro-present-v1.js
            tahoe79/assets/powerslidepro-audience.html
            tahoe79/assets/powerslidepro-logo.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        working-directory: tahoe79/powerslidepro-desktop
        run: npm install --no-audit --no-fund
      - name: Check JavaScript and verify offline bundle
        working-directory: tahoe79/powerslidepro-desktop
        run: npm run check
      - name: Build installer
        working-directory: tahoe79/powerslidepro-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: powerslidepro-desktop-${{ matrix.target }}
          path: |
            tahoe79/powerslidepro-desktop/dist/*.exe
            tahoe79/powerslidepro-desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: powerslidepro-desktop-*
          merge-multiple: true
          path: release-assets
      - name: Check all three installers exist
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -ge 1
          test "$(find release-assets -maxdepth 1 -name '*mac*x64.dmg' | wc -l)" -ge 1
          test "$(find release-assets -maxdepth 1 -name '*mac*arm64.dmg' | wc -l)" -ge 1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: powerslidepro-desktop-v0.1.0
          name: PowerSlidePro Desktop v0.1.0 (unsigned beta)
          prerelease: true
          generate_release_notes: false
          body: |
            Offline PowerSlidePro for Windows and macOS (Intel / Apple Silicon).
            Bundled: Smart Bible Generate, 66 Bible books, Khmer OS fonts,
            slide editing, local save and Presenter/Audience screens.

            Beta installers are unsigned and Apple DMGs are not notarized.
            Hands-on editing, font fidelity, PPTX and dual-screen testing is
            recommended before real-world worship presentations.
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
