name: Build PowerSlidePro Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-powerslidepro-desktop.yml'
      - 'tahoe79/powerslidepro-desktop/**'
      - 'tahoe79/apps/deckcraft-web/**'
      - 'tahoe79/assets/fonts/**'
      - 'tahoe79/data/books/**'
      - 'tahoe79/assets/js/powerslidepro-present-v1.js'
      - 'tahoe79/assets/js/powerslidepro-downloads.js'
      - 'tahoe79/assets/powerslidepro-audience.html'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tahoe79/powerslidepro-desktop
            tahoe79/apps/deckcraft-web
            tahoe79/assets/fonts
            tahoe79/data/books
            tahoe79/assets/js/powerslidepro-present-v1.js
            tahoe79/assets/js/powerslidepro-downloads.js
            tahoe79/assets/powerslidepro-audience.html
            tahoe79/assets/powerslidepro-logo.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Tahoe79 Software Library JavaScript
        run: node --check tahoe79/assets/js/powerslidepro-downloads.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for application icons
        run: python -m pip install Pillow==11.3.0
      - name: Verify Windows file association configuration
        working-directory: tahoe79/powerslidepro-desktop
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const conf = require('./package.json');
          assert.equal(conf.version, '0.1.2');
          assert.equal(conf.build.nsis.perMachine, true);
          const assoc = conf.build.win.fileAssociations.find(x => x.ext === 'deckcraft');
          assert.equal(assoc.icon, 'deckcraft.ico');
          console.log('NSIS installer includes .deckcraft file association and custom icon.');
          JS
      - name: Verify editor and bundle all offline files
        working-directory: tahoe79/powerslidepro-desktop
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: powerslidepro-staged-source
          path: tahoe79/powerslidepro-desktop/
          if-no-files-found: error
          retention-days: 2

  package:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Staging on Linux avoids Windows Git checkout errors from unrelated
      # legacy tracked filenames in the full Tahoe repository.
      - uses: actions/download-artifact@v4
        with:
          name: powerslidepro-staged-source
          path: powerslidepro-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application JavaScript
        working-directory: powerslidepro-desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check scripts/stage.cjs
      - name: Install build dependencies
        working-directory: powerslidepro-desktop
        run: npm install --no-audit --no-fund
      - name: Validate dedicated document icon (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        working-directory: powerslidepro-desktop
        run: |
          if (-not (Test-Path "build/deckcraft.ico")) { throw "Missing .deckcraft document icon" }
          if ((Get-Item "build/deckcraft.ico").Length -lt 1024) { throw "Document icon too small" }
          Write-Host "Document icon packaged with PowerSlidePro main installer."
      - name: Build installer
        working-directory: powerslidepro-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ${{ secrets.POWERSLIDEPRO_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.POWERSLIDEPRO_WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:${{ matrix.target }}
      - name: Windows Defender scan and signing status
        if: matrix.target == 'win'
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.POWERSLIDEPRO_WIN_CSC_LINK != '' }}
        run: |
          $file = Get-ChildItem 'powerslidepro-desktop/dist/*.exe' | Select-Object -First 1
          if (-not $file) { throw 'No Windows installer found' }
          $sig = Get-AuthenticodeSignature -FilePath $file.FullName
          Write-Host "Authenticode status: $($sig.Status)"
          if ($env:SIGNING_CONFIGURED -eq 'true' -and $sig.Status -ne 'Valid') {
            throw 'Signing was configured, but the signature is invalid'
          }
          if ($sig.Status -ne 'Valid') {
            Write-Warning 'Unsigned beta: Windows SmartScreen may still warn users.'
          }
          $defender = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if (-not $defender -or -not $defender.AntivirusEnabled) {
            Write-Warning 'Defender not available on this runner; no antivirus scan was performed.'
          } else {
            Start-MpScan -ScanType CustomScan -ScanPath $file.FullName -ErrorAction Stop
            if (-not (Test-Path $file.FullName)) { throw 'Defender quarantined the installer' }
            Write-Host 'Defender custom scan completed.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: powerslidepro-desktop-${{ matrix.target }}
          path: |
            powerslidepro-desktop/dist/*.exe
            powerslidepro-desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: powerslidepro-desktop-*
          merge-multiple: true
          path: release-assets
      - name: Verify Windows and both Mac architectures
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -ge 1
          test "$(find release-assets -maxdepth 1 -name '*mac*x64.dmg' | wc -l)" -ge 1
          test "$(find release-assets -maxdepth 1 -name '*mac*arm64.dmg' | wc -l)" -ge 1
      - name: Generate SHA-256 installer checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum PowerSlidePro-*.exe PowerSlidePro-*.dmg > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: powerslidepro-desktop-v0.1.2
          name: PowerSlidePro Desktop v0.1.2 (unsigned beta)
          prerelease: true
          generate_release_notes: false
          body: |
            Offline PowerSlidePro Windows 10/11 and macOS (Intel / Apple Silicon).
            Includes Smart Bible Generate, 66 Bible books, Khmer OS fonts,
            editing, local save, PPTX export and Presenter/Audience screens.
            Windows installer also registers the .deckcraft extension and the
            custom blue file icon in the same installation (requires admin approval).
            Double-click or File → Open to open local .deckcraft presentations.
            
            Installers are unsigned by default. Windows SmartScreen and
            macOS Gatekeeper may warn on first install. Verified code signing
            is optional through GitHub Actions secrets.
            SHA256SUMS.txt allows users to verify installer integrity.
            Hands-on dual-screen testing is still recommended.
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
