name: Build Tahoe80 PowerSlidePro macOS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Tahoe80 DeckCraft Web']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-powerslidepro-tahoe80-macos.yml'
      - 'tahoe80/powerslidepro-desktop/**'
      - 'tahoe80/apps/deckcraft-web/**'
      - 'tahoe80/assets/fonts/**'
      - 'tahoe80/data/books/**'
      - 'tahoe80/assets/js/powerslidepro-present-v1.js'
      - 'tahoe80/assets/js/powerslidepro-downloads.js'
      - 'tahoe80/assets/powerslidepro-audience.html'
      - 'tahoe80/assets/powerslidepro-logo.png'

permissions:
  contents: read

concurrency:
  group: tahoe80-powerslidepro-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    # The web workflow writes compiled WASM with GITHUB_TOKEN; such writes do
    # not trigger push workflows. workflow_run packages that verified output.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tahoe80/powerslidepro-desktop
            tahoe80/apps/deckcraft-web
            tahoe80/assets/fonts
            tahoe80/data/books
            tahoe80/assets/js/powerslidepro-present-v1.js
            tahoe80/assets/js/powerslidepro-downloads.js
            tahoe80/assets/powerslidepro-audience.html
            tahoe80/assets/powerslidepro-logo.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon generator dependency
        run: python -m pip install Pillow==11.3.0
      - name: Validate Tahoe80 source, offline fonts, Bible and WASM payload
        working-directory: tahoe80/powerslidepro-desktop
        run: npm run check
      - name: Verify macOS document association and version
        working-directory: tahoe80/powerslidepro-desktop
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const p = require('./package.json');
          assert.equal(p.build.mac.fileAssociations.find(x => x.ext === 'deckcraft')?.icon, 'deckcraft.icns');
          assert.equal(p.build.mac.fileAssociations.find(x => x.ext === 'deckcraft')?.role, 'Editor');
          assert.ok(fs.statSync('build/deckcraft.icns').size > 1024);
          assert.equal(require('./package.json').version, '0.1.16');
          assert.ok(require('./package.json').build.files.includes('export-formats.cjs'));
          assert.ok(fs.statSync('payload/tahoe80/apps/deckcraft-web/index.html').size > 0);
          const wasm=fs.readdirSync('payload/tahoe80/apps/deckcraft-web').find(x=>x.endsWith('_bg.wasm'));
          assert.ok(wasm && fs.readFileSync('payload/tahoe80/apps/deckcraft-web/'+wasm).includes(Buffer.from('saveImagesDone')), 'New slide-image export WASM build is required');
          console.log('Tahoe80 offline staging and macOS .deckcraft association validated.');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: tahoe80-macos-staged
          path: tahoe80/powerslidepro-desktop/
          if-no-files-found: error
          retention-days: 2

  package:
    needs: stage
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tahoe80-macos-staged
          path: powerslidepro-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and desktop tests
        working-directory: powerslidepro-desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check export-formats.cjs
          node --check pc-fonts.cjs
          node --check updater.cjs
          node --check scripts/stage.cjs
          node --check scripts/after-pack.cjs
          node --test tests/*.test.cjs
      - name: Verify actual macOS installed-font catalog
        working-directory: powerslidepro-desktop
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const {createMacFontCatalog}=require('./mac-fonts.cjs');
          (async()=>{
            const fonts=createMacFontCatalog();
            const families=fonts.scan();
            assert.ok(families.length>=10,'macOS should expose installed system font families');
            const candidate=families.find(n=>/Helvetica Neue|Arial|SF Pro/i.test(n))||families[0];
            const data=await fonts.read(candidate);
            assert.ok(data?.bytes?.length>100,'a discovered macOS font must be loadable');
            console.log('Native macOS font scan passed:',families.length,'families; loaded',candidate);
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Install desktop dependencies
        working-directory: powerslidepro-desktop
        run: npm install --no-audit --no-fund
      - name: Build Intel and Apple Silicon DMGs
        working-directory: powerslidepro-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Verify installers, architecture and app signatures
        shell: bash
        working-directory: powerslidepro-desktop
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            files=(dist/PowerSlidePro-*-mac-${arch}.dmg)
            test -s "${files[0]}"
            echo "DMG ready: ${files[0]}"
            app="dist/mac-${arch}/PowerSlidePro.app"
            if [ ! -d "$app" ] && [ "$arch" = "x64" ]; then app="dist/mac/PowerSlidePro.app"; fi
            test -d "$app"
            test -s "$app/Contents/Resources/deckcraft.icns"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes' "$app/Contents/Info.plist" | grep -q deckcraft
            codesign --verify --deep --verbose=2 "$app"
            echo "Verified ${arch} PowerSlidePro.app"
          done
          (cd dist && shasum -a 256 PowerSlidePro-*-mac-*.dmg > SHA256SUMS-macOS.txt)
          test -s dist/SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: powerslidepro-tahoe80-macos-installers
          path: |
            powerslidepro-desktop/dist/*-mac-x64.dmg
            powerslidepro-desktop/dist/*-mac-arm64.dmg
            powerslidepro-desktop/dist/SHA256SUMS-macOS.txt
          if-no-files-found: error
          retention-days: 30

# Do not publish GitHub Releases from this workflow. Installers remain CI
# artifacts until Tahoe80 macOS runtime testing and release approval pass.
