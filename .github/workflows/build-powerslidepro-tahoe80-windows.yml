name: Build Tahoe80 PowerSlidePro Windows

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Tahoe80 DeckCraft Web']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-powerslidepro-tahoe80-windows.yml'
      - 'tahoe80/powerslidepro-desktop/**'
      - 'tahoe80/apps/deckcraft-web/**'
      - 'tahoe80/assets/fonts/**'
      - 'tahoe80/data/books/**'
      - 'tahoe80/assets/js/powerslidepro-present-v1.js'
      - 'tahoe80/assets/powerslidepro-audience.html'
      - 'tahoe80/assets/powerslidepro-logo.png'

permissions:
  contents: read

concurrency:
  group: tahoe80-powerslidepro-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tahoe80/powerslidepro-desktop
            tahoe80/apps/deckcraft-web
            tahoe80/assets/fonts
            tahoe80/data/books
            tahoe80/assets/js/powerslidepro-present-v1.js
            tahoe80/assets/js/powerslidepro-downloads.js
            tahoe80/assets/powerslidepro-audience.html
            tahoe80/assets/powerslidepro-logo.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon generator dependency
        run: python -m pip install Pillow==11.3.0
      - name: Validate bundled WASM, 66 Bible books, Khmer OS fonts and JavaScript
        working-directory: tahoe80/powerslidepro-desktop
        run: npm run check
      - name: Check Windows 0.1.10 installation and font preference config
        working-directory: tahoe80/powerslidepro-desktop
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),p=require('./package.json');
          assert.equal(p.version,'0.1.10');
          assert.equal(p.build.nsis.perMachine,true);
          assert.equal(p.build.win.fileAssociations.find(x=>x.ext==='deckcraft')?.icon,'deckcraft.ico');
          assert.ok(p.build.files.includes('ui-font-prefs.cjs'),'persistent preferences packaged');
          assert.ok(fs.statSync('build/deckcraft.ico').size>1024);
          assert.ok(fs.statSync('payload/tahoe80/apps/deckcraft-web/index.html').size>0);
          console.log('Tahoe80 Windows staging and document icon passed.');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: tahoe80-windows-staged
          path: tahoe80/powerslidepro-desktop/
          if-no-files-found: error
          retention-days: 2

  package:
    needs: stage
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tahoe80-windows-staged
          path: powerslidepro-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Windows script syntax and font preference persistence tests
        shell: pwsh
        working-directory: powerslidepro-desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check ui-font-prefs.cjs
          node --check pc-fonts.cjs
          node --check updater.cjs
          node --test tests/pc-fonts.test.cjs tests/updater.test.cjs tests/mac-fonts.test.cjs tests/ui-font-prefs.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Windows JS tests failed" }
      - name: Install desktop build dependencies
        working-directory: powerslidepro-desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows 10/11 x64 installer
        working-directory: powerslidepro-desktop
        env:
          WIN_CSC_LINK: ${{ secrets.POWERSLIDEPRO_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.POWERSLIDEPRO_WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Validate installer, updater manifest and checksums
        shell: pwsh
        working-directory: powerslidepro-desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'dist/PowerSlidePro-0.1.10-win-x64.exe' -ErrorAction Stop | Select-Object -First 1
          if (-not $exe -or $exe.Length -lt 1000000) { throw 'Windows installer missing or too small' }
          if (-not (Test-Path 'dist/latest.yml')) { throw 'Windows auto-update manifest missing' }
          $manifest=Get-Content -Raw 'dist/latest.yml'
          if ($manifest -notmatch 'version: 0\.1\.10' -or $manifest -notmatch 'sha512:') { throw 'Windows updater manifest invalid' }
          $sig=Get-AuthenticodeSignature $exe.FullName
          Write-Host "Authenticode signature: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { Write-Warning 'Unsigned beta; Windows SmartScreen may show a warning.' }
          $hash=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content 'dist/SHA256SUMS-Windows.txt'
          if (-not (Test-Path 'dist/SHA256SUMS-Windows.txt')) { throw 'Missing checksums' }
      - uses: actions/upload-artifact@v4
        with:
          name: powerslidepro-tahoe80-windows-installer
          path: |
            powerslidepro-desktop/dist/PowerSlidePro-0.1.10-win-x64.exe
            powerslidepro-desktop/dist/latest.yml
            powerslidepro-desktop/dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 30

# No automatic release. Review and verify both platforms before publishing.
