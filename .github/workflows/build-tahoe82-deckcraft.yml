name: Build Tahoe82 DeckCraft Web

on:
  push:
    branches: [main]
    paths:
      - 'tahoe82/deckcraft-src/**'
      - '.github/workflows/build-tahoe82-deckcraft.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahoe82-deckcraft-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust + WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tahoe82/deckcraft-src

      - name: Install wasm-opt
        run: |
          # GitHub's Ubuntu images normally have current package indexes.
          # Avoid a slow mirror refresh unless these packages are unavailable.
          if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y binaryen python3-fonttools; then
            sudo apt-get update -o Acquire::Retries=2
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y binaryen python3-fonttools
          fi
          wasm-opt --version
          /usr/bin/python3 -c 'import fontTools'

      - name: Test Khmer generator clipboard and native text input
        run: |
          node --check tahoe82/deckcraft-src/apps/deckcraft-web/generator-paste.js
          node --test tahoe82/deckcraft-src/apps/deckcraft-web/generator-paste.test.cjs
      - name: Test bundled/installed font grouping and rescan
        working-directory: tahoe82/deckcraft-src
        run: cargo test -p deckcraft-fonts --test tahoe_font_group
      - name: Test grouped song Undo/Redo and rollback
        working-directory: tahoe82/deckcraft-src
        run: cargo test -p deckcraft-engine --test tahoe_undo_group
      - name: Verify Cloudinary file-list row layout source
        run: |
          grep -q 'Fixed file-table columns' tahoe82/deckcraft-src/crates/ui-egui/src/backstage.rs
          grep -q 'let row_date = row_storage - 103.0' tahoe82/deckcraft-src/crates/ui-egui/src/backstage.rs
          grep -q 'for (label, action, w) in labels' tahoe82/deckcraft-src/crates/ui-egui/src/backstage.rs
      - name: Build DeckCraft Web
        run: |
          set -euxo pipefail
          # Tahoe82 is self-contained. Preserve its existing font and song
          # payload before Trunk replaces only the generated editor directory.
          backup="$(mktemp -d)"
          cp -a tahoe82/apps/deckcraft-web/fonts "$backup/fonts"
          cp -a tahoe82/apps/deckcraft-web/song-library "$backup/song-library"
          rm -rf tahoe82/apps/deckcraft-web
          mkdir -p tahoe82/apps/deckcraft-web
          cd tahoe82/deckcraft-src/apps/deckcraft-web
          trunk build --release
          test -s ../../../apps/deckcraft-web/index.html
          cd ../../..
          cp -a "$backup/fonts" apps/deckcraft-web/fonts
          cp -a "$backup/song-library" apps/deckcraft-web/song-library
          test -s apps/deckcraft-web/fonts/SFHelloKOKH-Regular.ttf
          test -s apps/deckcraft-web/song-library/songs.json
          test -s apps/deckcraft-web/song-library/allsong2.json
          test -s apps/deckcraft-web/song-library/allsong3.json
          find apps/deckcraft-web -maxdepth 2 -type f -print

      - name: Validate build
        run: |
          set -euxo pipefail
          test "$(find tahoe82/data/books -maxdepth 1 -name '*.json' | wc -l)" -eq 66
          test -f tahoe82/apps/deckcraft-web/index.html
          find tahoe82/apps/deckcraft-web -maxdepth 1 -name '*.wasm' -print -quit | grep -q .
          test -s tahoe82/apps/deckcraft-web/fonts/SFHelloKOKH-Regular.ttf
          test -s tahoe82/apps/deckcraft-web/song-library/songs.json
          test -s tahoe82/apps/deckcraft-web/song-library/allsong2.json
          test -s tahoe82/apps/deckcraft-web/song-library/allsong3.json
          test -s tahoe82/apps/deckcraft-web/font-manager.js
          node --check tahoe82/apps/deckcraft-web/font-manager.js
          test -s tahoe82/apps/deckcraft-web/generator-paste.js
          node --check tahoe82/apps/deckcraft-web/generator-paste.js

      - name: Commit compiled DeckCraft Web
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Compiled WASM and font files are binary: rebasing a build commit
          # over another build's changed artifacts creates unresolvable conflicts.
          # Preserve this build's outputs and place them on the latest main tip.
          build_output="$(mktemp -d)"
          cp -a tahoe82/apps/deckcraft-web "$build_output/deckcraft-web"
          cp tahoe82/deckcraft-src/Cargo.lock "$build_output/Cargo.lock"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf tahoe82/apps/deckcraft-web
            cp -a "$build_output/deckcraft-web" tahoe82/apps/deckcraft-web
            cp "$build_output/Cargo.lock" tahoe82/deckcraft-src/Cargo.lock
            git add -A tahoe82/apps/deckcraft-web tahoe82/deckcraft-src/Cargo.lock
            git add -f tahoe82/apps/deckcraft-web
            if git diff --cached --quiet; then
              echo "Compiled outputs already current."
              break
            fi
            git commit -m "Build DeckCraft Web for Tahoe82"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done

      - name: Upload compiled DeckCraft artifact
        uses: actions/upload-artifact@v4
        with:
          name: deckcraft-web-tahoe82
          path: |
            tahoe82/apps/deckcraft-web
            !tahoe82/apps/deckcraft-web/fonts/**
