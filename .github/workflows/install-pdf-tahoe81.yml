name: Install PDF web app into Tahoe81

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-pdf-tahoe81.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tahoe81-pdf-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify PdfCraft v0.13.0 web release
        shell: bash
        run: |
          curl -fL --retry 4 --retry-all-errors \
            'https://github.com/storytold/pdfcraft/releases/download/v0.13.0/pdfcraft-web-0.13.0.zip' \
            -o "${RUNNER_TEMP}/pdfcraft-web-0.13.0.zip"
          printf '%s  %s\n' \
            'b16bb14222f371bc5c8da9dc2ee39c77c35f748ffd953d738e4cb3241287b3c8' \
            "${RUNNER_TEMP}/pdfcraft-web-0.13.0.zip" | sha256sum -c -
      - name: Extract safely and verify WebAssembly app
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil, stat
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          folder=Path("tahoe81/pdf")
          archive=Path(os.environ["RUNNER_TEMP"])/"pdfcraft-web-0.13.0.zip"
          folder.mkdir(parents=True,exist_ok=True)
          with ZipFile(archive) as z:
              files=[item for item in z.infolist() if not item.is_dir()]
              assert files, "Empty PdfCraft web release"
              assert sum(item.file_size for item in files)<300_000_000, "Unexpected release size"
              for item in files:
                  path=PurePosixPath(item.filename)
                  parts=path.parts
                  assert parts and ".." not in parts and not path.is_absolute(), item.filename
                  assert not stat.S_ISLNK(item.external_attr >> 16), item.filename
                  if parts[0]=="pdfcraft-web-0.13.0": parts=parts[1:]
                  if not parts or parts[0]=="__MACOSX": continue
                  dest=folder.joinpath(*parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(item) as source, dest.open("wb") as target:
                      shutil.copyfileobj(source,target,length=1024*1024)
          assert (folder/"index.html").is_file(), "Web entry point missing"
          assert list(folder.glob("*.js")), "JavaScript loader missing"
          assert list(folder.glob("*.wasm")), "WASM engine missing"
          print("Installed PdfCraft browser release:", len(list(folder.rglob("*"))), "paths")
          PY
      - name: Preserve upstream licenses and attributions
        shell: bash
        run: |
          for name in LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md; do
            curl -fL --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/storytold/pdfcraft/v0.13.0/${name}" \
              -o "tahoe81/pdf/${name}"
          done
      - name: Publish PDF web files into Tahoe81
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tahoe81/pdf/
          if ! git diff --cached --quiet; then
            git commit -m 'Install verified PdfCraft WebAssembly editor in Tahoe81 PDF'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
