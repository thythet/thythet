name: Bible App — Windows and macOS Beta

on:
  push:
    branches: [main]
    paths:
      - "bibleapp/**"
      - ".github/workflows/release-bibleapp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bibleapp-v0.1.0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-web:
    name: Validate Bible and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bibleapp
          sparse-checkout-cone-mode: true
        env:
          # Suppress NTFS path validation for files outside the sparse checkout.
          # An unrelated historical folder contains a Windows-incompatible path.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source syntax and all 66 Bible files
        working-directory: bibleapp
        run: |
          npm run check
          node scripts/verify.mjs
      - name: Inspect web assets
        run: |
          test -s bibleapp/web/index.html
          test -s bibleapp/web/style.css
          test -s bibleapp/web/sw.js
          test -s bibleapp/src-tauri/icons/icon.png
  build-and-release:
    name: Build ${{ matrix.platform }}
    needs: validate-web
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bibleapp
          sparse-checkout-cone-mode: true
        env:
          # Suppress NTFS path validation for files outside the sparse checkout.
          # An unrelated historical folder contains a Windows-incompatible path.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "bibleapp/src-tauri -> target"
      - name: Install dependencies and generate platform icons
        working-directory: bibleapp
        run: |
          npm install --no-audit --no-fund
          npm run icons
      - name: Build Bible App desktop bundles
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: bibleapp
      - name: Save installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bibleapp-${{ matrix.platform }}
          path: |
            bibleapp/src-tauri/target/release/bundle/nsis/*.exe
            bibleapp/src-tauri/target/release/bundle/msi/*.msi
            bibleapp/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bibleapp-*
          merge-multiple: true
          path: release-assets
      - name: Check all three platform installers and create checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*.dmg' -type f | wc -l)" -ge 2
          test "$(find release-assets -maxdepth 1 -name '*.exe' -type f | wc -l)" -ge 1
          (cd release-assets && sha256sum *.dmg *.exe > SHA256SUMS.txt)
          ls -lah release-assets
      - name: Publish Bible App beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bibleapp-v0.1.0
          target_commitish: main
          name: "Bible App v0.1.0 (Windows + macOS beta)"
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Bible App v0.1.0: first offline Khmer 1954 Bible reader built
            with Rust + Tauri 2. Includes 66 Bible books, search, verse
            selection, colorful highlights, notes, bookmarks and
            Quick Slideshow. Bible App Web is at https://thythet.com/bibleapp/.

            Beta limitations: Google login, PowerSlidePro launch,
            professional slide editing, and PPTX/DOCX/PDF export are
            planned but NOT implemented. Mac installers are unsigned.
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
