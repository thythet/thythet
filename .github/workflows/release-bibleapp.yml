name: Bible App — Windows and macOS Beta

on:
  push:
    branches: [main]
    paths:
      - "bibleapp/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bibleapp-v0.1.0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-web:
    name: Validate Bible and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bibleapp
          sparse-checkout-cone-mode: true
        env:
          # Suppress NTFS path validation for files outside the sparse checkout.
          # An unrelated historical folder contains a Windows-incompatible path.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source syntax and all 66 Bible files
        working-directory: bibleapp
        run: |
          npm run check
          node scripts/verify.mjs
      - name: Inspect web assets
        run: |
          test -s bibleapp/web/index.html
          test -s bibleapp/web/style.css
          test -s bibleapp/web/sw.js
          test -s bibleapp/src-tauri/icons/icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: bibleapp-source
          path: bibleapp/
          if-no-files-found: error
          retention-days: 7
  build-and-release:
    name: Build ${{ matrix.platform }}
    needs: validate-web
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bibleapp-source
          path: bibleapp
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "bibleapp/src-tauri -> target"
      - name: Install dependencies and generate platform icons
        working-directory: bibleapp
        run: |
          npm install --no-audit --no-fund
          npm run icons
      - name: Build Bible App desktop bundles
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: bibleapp
      - name: Save installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bibleapp-${{ matrix.platform }}
          path: |
            bibleapp/src-tauri/target/release/bundle/nsis/*.exe
            bibleapp/src-tauri/target/release/bundle/msi/*.msi
            bibleapp/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bibleapp-[mw]*
          merge-multiple: false
          path: bundled-installers
      - name: Validate Windows and both Mac installers, and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          find bundled-installers -type f -print | sort
          test -s 'bundled-installers/bibleapp-windows-latest/nsis/Bible App_0.1.0_x64-setup.exe'
          test -s 'bundled-installers/bibleapp-windows-latest/msi/Bible App_0.1.0_x64_en-US.msi'
          test -s 'bundled-installers/bibleapp-macos-15/dmg/Bible App_0.1.0_aarch64.dmg'
          test -s 'bundled-installers/bibleapp-macos-15-intel/dmg/Bible App_0.1.0_x64.dmg'
          mkdir -p release-assets
          cp 'bundled-installers/bibleapp-windows-latest/nsis/Bible App_0.1.0_x64-setup.exe' release-assets/BibleApp-0.1.0-win-x64.exe
          cp 'bundled-installers/bibleapp-windows-latest/msi/Bible App_0.1.0_x64_en-US.msi' release-assets/BibleApp-0.1.0-win-x64.msi
          cp 'bundled-installers/bibleapp-macos-15/dmg/Bible App_0.1.0_aarch64.dmg' release-assets/BibleApp-0.1.0-mac-arm64.dmg
          cp 'bundled-installers/bibleapp-macos-15-intel/dmg/Bible App_0.1.0_x64.dmg' release-assets/BibleApp-0.1.0-mac-x64.dmg
          (cd release-assets && sha256sum *.exe *.msi *.dmg > SHA256SUMS.txt)
          ls -lh release-assets/
      - name: Publish Bible App beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bibleapp-v0.1.0
          target_commitish: main
          name: "Bible App v0.1.0 (Windows + macOS beta)"
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Bible App v0.1.0: offline Khmer Bible 1954 reader built with
            Rust + Tauri 2 for Windows and macOS. All 66 Bible books,
            search, verse selection, colorful highlights, notes,
            bookmarks, Quick Slideshow, resizable book sidebar and EN/KH UI.
            Web edition: https://thythet.com/bibleapp/.

            Beta limitations: Google sign-in, PowerSlidePro launch,
            professional slide editing and PPTX/DOCX/PDF exports are not
            implemented yet. Desktop installations are unsigned.
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
