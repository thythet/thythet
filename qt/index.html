<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<title>ពេលសៀមស្ងាត់</title>

<style>

/* =====================================================
   FONT
===================================================== */

@font-face {
    font-family: "Krasar";
    src: url("https://thythet.com/prayinfo2/assets/fonts/Krasar.woff") format("woff");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}


/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #d8d8d8;

    font-family: "Krasar", sans-serif;
}


/* =====================================================
   PDF VIEWER
===================================================== */

#viewer {
    position: fixed;
    inset: 0;

    overflow: auto;

    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;

    background: #d8d8d8;
}

#pageContainer {
    min-width: 100%;
    min-height: 100%;

    display: flex;
    justify-content: center;
    align-items: flex-start;
}

#pdfCanvas {
    display: block;

    background: #fff;

    transform-origin: top center;

    box-shadow:
        0 0 7px rgba(0,0,0,.18);
}


/* =====================================================
   TOP BUTTONS
===================================================== */

#writeBtn,
#googleBtn,
#fitZoomBtn {

    position: fixed;

    top:
        calc(
            8px +
            env(safe-area-inset-top)
        );

    height: 38px;

    border: 0;
    border-radius: 20px;

    z-index: 100;

    font-family: "Krasar", sans-serif;

    cursor: pointer;
}


/* WRITE */

#writeBtn {
    right: 8px;

    padding: 0 14px;

    background:
        rgba(0,0,0,.72);

    color: white;

    font-size: 14px;
}


/* GOOGLE */

#googleBtn {
    right: 88px;

    max-width: 145px;

    padding: 0 11px;

    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    background:
        rgba(255,255,255,.96);

    color: #222;

    font-size: 11px;

    box-shadow:
        0 1px 5px rgba(0,0,0,.15);
}

#googleBtn.connected {
    color: #08783b;
}


/* FIT */

#fitZoomBtn {
    left: 8px;

    padding: 0 12px;

    background:
        rgba(0,0,0,.74);

    color: white;

    font-size: 11px;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transform:
        translateY(-4px);

    transition:
        opacity .18s,
        transform .18s,
        visibility .18s;
}

#fitZoomBtn.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transform:
        translateY(0);
}


/* =====================================================
   SAVED DOT
===================================================== */

#savedDot {

    display: none;

    position: absolute;

    top: 4px;
    right: 4px;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #35d66f;
}

#savedDot.show {
    display: block;
}


/* =====================================================
   NAVIGATION
===================================================== */

.navBtn {

    position: fixed;

    top: 50%;

    transform:
        translateY(-50%);

    z-index: 80;

    width: 38px;
    height: 58px;

    border: 0;

    border-radius: 11px;

    background:
        rgba(0,0,0,.25);

    color: white;

    font-size: 28px;
}

#prevBtn {
    left: 5px;
}

#nextBtn {
    right: 5px;
}

.navBtn.hidden {

    opacity: 0;

    pointer-events: none;
}


/* =====================================================
   PAGE NUMBER
===================================================== */

#pageInfo {

    position: fixed;

    left: 50%;

    bottom:
        calc(
            7px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    z-index: 80;

    padding:
        4px 9px;

    border-radius: 14px;

    background:
        rgba(0,0,0,.52);

    color: white;

    font-size: 10px;

    pointer-events: none;
}


/* =====================================================
   ZOOM INFO
===================================================== */

#zoomInfo {

    position: fixed;

    top:
        calc(
            52px +
            env(safe-area-inset-top)
        );

    left: 8px;

    z-index: 80;

    padding:
        4px 8px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.55);

    color: white;

    font-size: 10px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .15s;
}

#zoomInfo.show {
    opacity: 1;
}


/* =====================================================
   LOADING
===================================================== */

#loading {

    position: fixed;
    inset: 0;

    z-index: 500;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #111;
}

.spinner {

    width: 25px;
    height: 25px;

    border:
        3px solid
        rgba(255,255,255,.2);

    border-top-color:
        white;

    border-radius: 50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}


/* =====================================================
   ERROR
===================================================== */

#errorMessage {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 600;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background: #111;

    color: white;

    text-align: center;
}


/* =====================================================
   FORM OVERLAY
===================================================== */

#noteOverlay {

    position: fixed;
    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    padding:
        calc(
            6px +
            env(safe-area-inset-top)
        )
        7px
        calc(
            48px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(0,0,0,.08);

    backdrop-filter: none;
    -webkit-backdrop-filter: none;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .15s;
}

#noteOverlay.show {

    opacity: 1;

    visibility: visible;
}


/* =====================================================
   POPUP
===================================================== */

#notePopup {

    width: 100%;

    max-width: 520px;

    max-height: 100%;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    padding: 9px;

    border-radius: 16px;

    background:
        rgba(255,255,255,.97);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.22);

    transform:
        translate3d(0,0,0);

    will-change: transform;
}


/* =====================================================
   HEADER / DRAG
===================================================== */

.noteHeader {

    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 7px;

    cursor: grab;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
}

.noteHeader.dragging {
    cursor: grabbing;
}

.formTitle {

    flex: 1;

    font-size: 15px;

    font-weight: bold;

    color: #111;
}

#closeNote {

    width: 31px;
    height: 31px;

    flex-shrink: 0;

    border: 0;

    border-radius: 50%;

    background: #eee;

    color: #333;

    font-size: 19px;

    cursor: pointer;
}


/* =====================================================
   QUESTION
===================================================== */

.noteGroup {
    margin-bottom: 6px;
}

.noteTitle {

    display: block;

    margin-bottom: 2px;

    color: #079447;

    font-family:
        "Krasar",
        sans-serif;

    font-size: 13px;

    font-weight: bold;

    line-height: 1.35;
}


/* =====================================================
   INPUT
===================================================== */

.noteInput {

    display: block;

    width: 100%;

    height: 39px;
    min-height: 39px;

    overflow-y: hidden;

    resize: none;

    padding:
        6px 8px;

    border:
        1px solid
        #d2d2d2;

    border-radius: 8px;

    outline: none;

    background:
        rgba(255,255,255,.92);

    color: #111;

    font-family:
        "Krasar",
        sans-serif;

    font-size: 13px;

    line-height: 1.45;

    user-select: text;

    -webkit-user-select: text;
}

.noteInput:focus {
    border-color: #079447;
}


/* =====================================================
   STATUS
===================================================== */

#noteStatus {

    min-height: 14px;

    margin-top: 2px;
    margin-bottom: 5px;

    color: #777;

    font-size: 9.5px;

    line-height: 1.3;
}

#noteStatus.firebaseSaved {
    color: #079447;
}


/* =====================================================
   FORM BUTTONS
===================================================== */

.noteActions {

    display: flex;

    gap: 6px;

    margin-top: 3px;
}

.noteActionBtn {

    height: 39px;

    border: 0;

    border-radius: 9px;

    font-family:
        "Krasar",
        sans-serif;

    font-size: 12px;

    cursor: pointer;
}

#deleteNote {

    width: 65px;

    background: #eee;

    color: #555;
}

#captureNote {

    width: 82px;

    background: #eee;

    color: #111;
}

#saveNote {

    flex: 1;

    min-width: 0;

    background: #111;

    color: white;
}

.noteActionBtn:disabled,
#googleBtn:disabled {

    opacity: .55;
}

</style>
</head>

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

    getAuth,

    browserLocalPersistence,

    setPersistence,

    onAuthStateChanged,

    signInAnonymously,

    GoogleAuthProvider,

    linkWithPopup,

    signInWithPopup,

    signInWithCredential

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

    getDatabase,

    ref,

    get,

    set,

    update,

    remove,

    onValue,

    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBA64C_cctFHJXUJjgAQ5PzbfmBVhdSjZ4",

    authDomain:
        "qt-app-ddabb.firebaseapp.com",

    databaseURL:
        "https://qt-app-ddabb-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "qt-app-ddabb",

    storageBucket:
        "qt-app-ddabb.firebasestorage.app",

    messagingSenderId:
        "198096024652",

    appId:
        "1:198096024652:web:43c9f097842f1bc3c830e9"

};


const firebaseApp =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(
        firebaseApp
    );


const database =
    getDatabase(
        firebaseApp
    );


const googleProvider =
    new GoogleAuthProvider();


googleProvider.setCustomParameters({
    prompt:
        "select_account"
});


/* =====================================================
   FIREBASE STATE
===================================================== */

let firebaseUser =
    null;


let firebaseReady =
    false;


let firebaseAuthError =
    "";


/* =====================================================
   DEVICE ID
===================================================== */

const DEVICE_ID_KEY =
    "qt_device_id_v3";


function createDeviceId() {

    if (
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }


    return (

        "device-" +

        Date.now() +

        "-" +

        Math.random()
            .toString(36)
            .slice(2)

    );

}


function getDeviceId() {

    let id =
        localStorage.getItem(
            DEVICE_ID_KEY
        );


    if (!id) {

        id =
            createDeviceId();


        localStorage.setItem(
            DEVICE_ID_KEY,
            id
        );

    }


    return id;

}


const DEVICE_ID =
    getDeviceId();


/* =====================================================
   DOM
===================================================== */

const viewer =
    document.getElementById(
        "viewer"
    );


const pageContainer =
    document.getElementById(
        "pageContainer"
    );


const canvas =
    document.getElementById(
        "pdfCanvas"
    );


const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false
        }
    );


const prevBtn =
    document.getElementById(
        "prevBtn"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const pageInfo =
    document.getElementById(
        "pageInfo"
    );


const zoomInfo =
    document.getElementById(
        "zoomInfo"
    );


const fitZoomBtn =
    document.getElementById(
        "fitZoomBtn"
    );


const writeBtn =
    document.getElementById(
        "writeBtn"
    );


const googleBtn =
    document.getElementById(
        "googleBtn"
    );


const savedDot =
    document.getElementById(
        "savedDot"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const noteOverlay =
    document.getElementById(
        "noteOverlay"
    );


const notePopup =
    document.getElementById(
        "notePopup"
    );


const noteHeader =
    document.getElementById(
        "noteHeader"
    );


const closeNote =
    document.getElementById(
        "closeNote"
    );


const note1 =
    document.getElementById(
        "note1"
    );


const note2 =
    document.getElementById(
        "note2"
    );


const note3 =
    document.getElementById(
        "note3"
    );


const note4 =
    document.getElementById(
        "note4"
    );


const note5 =
    document.getElementById(
        "note5"
    );


const noteStatus =
    document.getElementById(
        "noteStatus"
    );


const saveNote =
    document.getElementById(
        "saveNote"
    );


const deleteNote =
    document.getElementById(
        "deleteNote"
    );


const captureNote =
    document.getElementById(
        "captureNote"
    );


const noteInputs =
    document.querySelectorAll(
        ".noteInput"
    );


/* =====================================================
   STATUS HELPER
===================================================== */

function setStatus(
    text,
    firebaseSaved = false
) {

    noteStatus.textContent =
        text;


    noteStatus.classList.toggle(
        "firebaseSaved",
        firebaseSaved
    );

}


/* =====================================================
   GOOGLE USER CHECK
===================================================== */

function isGoogleUser(
    user = firebaseUser
) {

    if (!user) {

        return false;

    }


    return user.providerData.some(

        provider =>

            provider.providerId ===
            "google.com"

    );

}


/* =====================================================
   GOOGLE BUTTON
===================================================== */

function updateGoogleButton() {

    if (
        firebaseUser &&
        isGoogleUser()
    ) {

        googleBtn.classList.add(
            "connected"
        );


        googleBtn.textContent =
            firebaseUser.displayName ||
            firebaseUser.email ||
            "Google ✓";


        googleBtn.title =
            firebaseUser.email ||
            "Google";


        googleBtn.disabled =
            true;

    }

    else {

        googleBtn.classList.remove(
            "connected"
        );


        googleBtn.textContent =
            "ចូល Google";


        googleBtn.title =
            "Google Login";


        googleBtn.disabled =
            false;

    }

}


/* =====================================================
   FIREBASE DATABASE PATH
===================================================== */

/*

ANONYMOUS:

anonymousUsers/
    UID/
        meta/
        pages/
            1/
            2/
            16/


GOOGLE:

users/
    UID/
        profile/
        pages/
            1/
            2/
            16/

*/


function getPageRef(
    pageNumber
) {

    if (!firebaseUser) {

        return null;

    }


    if (
        isGoogleUser()
    ) {

        return ref(

            database,

            "users/" +
            firebaseUser.uid +
            "/pages/" +
            pageNumber

        );

    }


    return ref(

        database,

        "anonymousUsers/" +
        firebaseUser.uid +
        "/pages/" +
        pageNumber

    );

}


/* =====================================================
   USER META
===================================================== */

async function updateUserMetadata() {

    if (!firebaseUser) {

        return;

    }


    try {

        if (
            isGoogleUser()
        ) {

            await update(

                ref(

                    database,

                    "users/" +
                    firebaseUser.uid +
                    "/profile"

                ),

                {

                    email:
                        firebaseUser.email ||
                        null,

                    displayName:
                        firebaseUser.displayName ||
                        null,

                    photoURL:
                        firebaseUser.photoURL ||
                        null,

                    accountType:
                        "google",

                    deviceId:
                        DEVICE_ID,

                    lastSeen:
                        serverTimestamp()

                }

            );

        }

        else {

            await update(

                ref(

                    database,

                    "anonymousUsers/" +
                    firebaseUser.uid +
                    "/meta"

                ),

                {

                    accountType:
                        "anonymous",

                    deviceId:
                        DEVICE_ID,

                    createdBy:
                        "qt-app",

                    lastSeen:
                        serverTimestamp()

                }

            );

        }


        console.log(
            "Firebase metadata saved"
        );

    }

    catch (error) {

        console.error(
            "Metadata error:",
            error
        );

    }

}


/* =====================================================
   FIREBASE AUTH START
===================================================== */

async function startFirebase() {

    try {

        await setPersistence(
            auth,
            browserLocalPersistence
        );


        let currentUser =
            await new Promise(

                resolve => {

                    const unsubscribe =
                        onAuthStateChanged(

                            auth,

                            user => {

                                unsubscribe();


                                resolve(
                                    user
                                );

                            }

                        );

                }

            );


        /*
        No Firebase user yet.
        Create anonymous user.
        */

        if (!currentUser) {

            console.log(
                "Creating anonymous Firebase user..."
            );


            const result =
                await signInAnonymously(
                    auth
                );


            currentUser =
                result.user;

        }


        firebaseUser =
            currentUser;


        firebaseReady =
            true;


        firebaseAuthError =
            "";


        console.log(
            "Firebase connected"
        );


        console.log(
            "UID:",
            firebaseUser.uid
        );


        console.log(
            "Anonymous:",
            firebaseUser.isAnonymous
        );


        updateGoogleButton();


        await updateUserMetadata();


        onAuthStateChanged(

            auth,

            async user => {

                firebaseUser =
                    user;


                firebaseReady =
                    !!user;


                updateGoogleButton();


                if (user) {

                    await updateUserMetadata();

                }

            }

        );


        return true;

    }

    catch (error) {

        console.error(
            "Firebase authentication error:",
            error
        );


        firebaseReady =
            false;


        firebaseUser =
            null;


        firebaseAuthError =
            error.code ||
            error.message ||
            "Unknown Firebase error";


        setStatus(

            "Firebase Error: " +
            firebaseAuthError

        );


        updateGoogleButton();


        return false;

    }

}

import * as pdfjsLib from

let pdfDocument =

/* =====================================================
   RENDER PDF PAGE
===================================================== */

async function renderPage(
    pageNumber
) {

    if (!pdfDocument) {

        return;

    }


    pageNumber =
        Math.max(

            1,

            Math.min(

                pageNumber,

                pdfDocument.numPages

            )

        );


    if (rendering) {

        pendingPage =
            pageNumber;


        return;

    }


    rendering =
        true;


    try {

        const page =
            await pdfDocument.getPage(
                pageNumber
            );


        const original =
            page.getViewport({
                scale:
                    1
            });


        const baseScale =
            viewer.clientWidth /
            original.width;


        const cssScale =
            baseScale *
            zoom;


        /*
        Lower render DPR at high zoom
        to protect mobile memory.
        */

        let dpr =
            Math.min(

                window.devicePixelRatio ||
                1,

                2

            );


        if (
            zoom >
            2.5
        ) {

            dpr =
                Math.min(
                    dpr,
                    1
                );

        }


        const viewport =
            page.getViewport({

                scale:
                    cssScale *
                    dpr

            });


        canvas.width =
            Math.floor(
                viewport.width
            );


        canvas.height =
            Math.floor(
                viewport.height
            );


        canvas.style.width =

            Math.floor(
                viewport.width /
                dpr
            ) +

            "px";


        canvas.style.height =

            Math.floor(
                viewport.height /
                dpr
            ) +

            "px";


        pageContainer.style.width =

            Math.max(

                viewer.clientWidth,

                viewport.width /
                dpr

            ) +

            "px";


        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(

            0,
            0,

            canvas.width,
            canvas.height

        );


        const renderTask =
            page.render({

                canvasContext:
                    ctx,

                viewport:
                    viewport

            });


        await renderTask.promise;


        currentPage =
            pageNumber;


        updatePDFUI();

    }

    catch (error) {

        if (
            error?.name !==
            "RenderingCancelledException"
        ) {

            console.error(
                "PDF render:",
                error
            );

        }

    }

    finally {

        rendering =
            false;


        if (
            pendingPage !== null &&
            pendingPage !== currentPage
        ) {

            const nextPage =
                pendingPage;


            pendingPage =
                null;


            renderPage(
                nextPage
            );

        }

        else {

            pendingPage =
                null;

        }

    }

}

/* =====================================================
   PINCH / SWIPE
===================================================== */

let touchStartX =
    0;


let touchStartY =
    0;


let singleTouch =
    false;


let isPinching =
    false;


let pinchStartDistance =
    0;


let pinchStartZoom =
    1;


let pinchPreviewZoom =
    1;


function getDistance(
    touches
) {

    const x =

        touches[0].clientX -

        touches[1].clientX;


    const y =

        touches[0].clientY -

        touches[1].clientY;


    return Math.sqrt(

        x * x +

        y * y

    );

}


viewer.addEventListener(

    "touchstart",

    event => {

        if (
            event.touches.length ===
            2
        ) {

            isPinching =
                true;


            singleTouch =
                false;


            pinchStartDistance =
                getDistance(
                    event.touches
                );


            pinchStartZoom =
                zoom;


            pinchPreviewZoom =
                zoom;


            return;

        }


        if (
            event.touches.length ===
            1
        ) {

            singleTouch =
                true;


            touchStartX =
                event.touches[0]
                    .clientX;


            touchStartY =
                event.touches[0]
                    .clientY;

        }

    },

    {
        passive:
            true
    }

);


viewer.addEventListener(

    "touchmove",

    event => {

        if (
            !isPinching ||
            event.touches.length !==
            2
        ) {

            return;

        }


        event.preventDefault();


        const distance =
            getDistance(
                event.touches
            );


        let newZoom =

            pinchStartZoom *

            (
                distance /
                pinchStartDistance
            );


        newZoom =
            Math.max(

                MIN_ZOOM,

                Math.min(

                    MAX_ZOOM,

                    newZoom

                )

            );


        pinchPreviewZoom =
            newZoom;


        canvas.style.transform =

            `scale(${
                newZoom /
                zoom
            })`;


        zoomInfo.textContent =

            Math.round(
                newZoom *
                100
            ) +

            "%";


        zoomInfo.classList.add(
            "show"
        );


        showFitButton(
            newZoom
        );

    },

    {
        passive:
            false
    }

);


viewer.addEventListener(

    "touchend",

    event => {

        if (
            isPinching
        ) {

            if (
                event.touches.length <
                2
            ) {

                zoom =
                    pinchPreviewZoom;


                canvas.style.transform =
                    "none";


                isPinching =
                    false;


                showFitButton(
                    zoom
                );


                renderPage(
                    currentPage
                );


                setTimeout(

                    () => {

                        zoomInfo.classList.remove(
                            "show"
                        );

                    },

                    800

                );

            }


            return;

        }


        /*
        When zoom > 100,
        horizontal movement pans.
        */

        if (
            !singleTouch ||
            zoom >
            1.05 ||
            !event.changedTouches.length
        ) {

            singleTouch =
                false;


            return;

        }


        const endX =
            event.changedTouches[0]
                .clientX;


        const endY =
            event.changedTouches[0]
                .clientY;


        const dx =
            endX -
            touchStartX;


        const dy =
            endY -
            touchStartY;


        if (
            Math.abs(dx) >
            65
            &&
            Math.abs(dx) >
            Math.abs(dy) *
            1.4
        ) {

            if (
                dx <
                0
            ) {

                nextPage();

            }

            else {

                previousPage();

            }

        }


        singleTouch =
            false;

    },

    {
        passive:
            true
    }

);

/* =====================================================

===================================================== */

let pageListenerUnsubscribe =
    null;


let lastLocalEdit =
    0;


function stopPageListener() {

    if (
        pageListenerUnsubscribe
    ) {

        pageListenerUnsubscribe();


        pageListenerUnsubscribe =
            null;

    }

}


function subscribeToPage(
    page
) {

    stopPageListener();


    if (
        !firebaseReady ||
        !firebaseUser
    ) {

        return;

    }


    const firebasePageRef =
        getPageRef(
            page
        );


    pageListenerUnsubscribe =
        onValue(

            firebasePageRef,

            snapshot => {

                if (
                    currentPage !==
                    page
                ) {

                    return;

                }


                /*
                Don't overwrite while
                user is actively typing.
                */

                if (
                    Date.now() -
                    lastLocalEdit <
                    1000
                ) {

                    return;

                }


                if (
                    snapshot.exists()
                ) {

                    const data =
                        snapshot.val();


                    setFormValues(
                        data
                    );


                    saveLocal(
                        page,
                        data
                    );


                    savedDot.classList.add(
                        "show"
                    );

                }

            },

            error => {

                console.error(
                    "Realtime listener:",
                    error
                );

            }

        );

}

async function savePageToFirebase(

    page,

    automatic = false,

    values = null

) {

    const data =
        values ||
        getFormValues();


    /*
    Always save locally immediately.
    */

    saveLocal(
        page,
        data
    );


    if (
        !firebaseReady ||
        !firebaseUser
    ) {

        savedDot.classList.remove(
            "show"
        );


        if (
            firebaseAuthError
        ) {

            setStatus(

                "Firebase Error: " +
                firebaseAuthError

            );

        }

        else {

            setStatus(
                "Firebase មិនបានភ្ជាប់"
            );

        }


        return false;

    }


    if (!automatic) {

        saveNote.disabled =
            true;


        saveNote.textContent =
            "កំពុងរក្សាទុក...";

    }


    try {

        const pageRef =
            getPageRef(
                page
            );


        console.log(
            "Saving to Firebase..."
        );


        console.log(
            "UID:",
            firebaseUser.uid
        );


        console.log(
            "Page:",
            page
        );


        console.log(
            "Account:",
            isGoogleUser()
                ?
                "GOOGLE"
                :
                "ANONYMOUS"
        );


        /*
        REAL FIREBASE WRITE
        */

        await set(

            pageRef,

            {

                ...data,

                page:
                    page,

                deviceId:
                    DEVICE_ID,

                accountType:
                    isGoogleUser()
                        ?
                        "google"
                        :
                        "anonymous",

                updatedAt:
                    serverTimestamp()

            }

        );


        /*
        Firebase has now confirmed
        the write.
        */

        console.log(
            "Firebase SAVE SUCCESS"
        );


        savedDot.classList.add(
            "show"
        );


        /*
        EXACT MESSAGE REQUESTED
        */

        setStatus(
            "✓ បានរក្សាទុកក្នុង Firebase",
            true
        );


        if (!automatic) {

            saveNote.textContent =
                "បានរក្សាទុក";


            setTimeout(

                () => {

                    saveNote.textContent =
                        "រក្សាទុក";

                },

                900

            );

        }


        await updateUserMetadata();


        return true;

    }

    catch (error) {

        console.error(
            "Firebase SAVE ERROR:",
            error
        );


        savedDot.classList.remove(
            "show"
        );


        setStatus(

            "Firebase Error: " +

            (
                error.code ||
                error.message ||
                "Save failed"
            )

        );


        if (!automatic) {

            saveNote.textContent =
                "រក្សាទុក";

        }


        return false;

    }

    finally {

        if (!automatic) {

            saveNote.disabled =
                false;

        }

    }

}

/* =====================================================
   MIGRATE ANONYMOUS -> GOOGLE
===================================================== */

async function migrateAnonymousToGoogle(
    backup
) {

    if (
        !firebaseUser ||
        !isGoogleUser()
    ) {

        return;

    }


    if (
        !backup ||
        typeof backup !==
        "object"
    ) {

        return;

    }


    try {

        const googlePagesRef =
            ref(

                database,

                "users/" +
                firebaseUser.uid +
                "/pages"

            );


        const currentSnapshot =
            await get(
                googlePagesRef
            );


        const existing =
            currentSnapshot.exists()

                ? currentSnapshot.val()

                : {};


        const updates =
            {};


        for (
            const [page, data]
            of
            Object.entries(
                backup
            )
        ) {

            /*
            Existing Google data wins.
            */

            if (
                !existing?.[page]
            ) {

                updates[page] = {

                    ...data,

                    accountType:
                        "google",

                    migratedFromAnonymous:
                        true

                };

            }

        }


        if (
            Object.keys(
                updates
            ).length >
            0
        ) {

            await update(
                googlePagesRef,
                updates
            );

        }


        await updateUserMetadata();

    }

    catch (error) {

        console.error(
            "Migration error:",
            error
        );

    }

}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

async function connectGoogle() {

    if (
        firebaseUser &&
        isGoogleUser()
    ) {

        return;

    }


    googleBtn.disabled =
        true;


    googleBtn.textContent =
        "កំពុងភ្ជាប់...";


    /*
    Flush current anonymous data first.
    */

    if (
        firebaseReady &&
        firebaseUser &&
        noteOverlay.classList.contains(
            "show"
        )
    ) {

        await savePageToFirebase(

            currentPage,

            true,

            getFormValues()

        );

    }


    const oldAnonymousUid =

        auth.currentUser?.isAnonymous

            ? auth.currentUser.uid

            : null;


    const anonymousBackup =
        await getAnonymousBackup();


    try {

        let result;


        /*
        Best case:
        link Google to anonymous UID.
        */

        if (
            auth.currentUser &&
            auth.currentUser.isAnonymous
        ) {

            try {

                result =
                    await linkWithPopup(

                        auth.currentUser,

                        googleProvider

                    );

            }

            catch (error) {

                /*
                Google account already
                exists in Firebase.
                */

                if (

                    error.code ===
                    "auth/credential-already-in-use"

                    ||

                    error.code ===
                    "auth/email-already-in-use"

                    ||

                    error.code ===
                    "auth/account-exists-with-different-credential"

                ) {

                    const credential =

                        GoogleAuthProvider
                            .credentialFromError(
                                error
                            )

                        ||

                        error.credential;


                    if (!credential) {

                        throw error;

                    }


                    result =
                        await signInWithCredential(

                            auth,

                            credential

                        );

                }

                else {

                    throw error;

                }

            }

        }

        else {

            result =
                await signInWithPopup(

                    auth,

                    googleProvider

                );

        }


        firebaseUser =
            result.user;


        firebaseReady =
            true;


        firebaseAuthError =
            "";


        await migrateAnonymousToGoogle(
            anonymousBackup
        );


        /*
        If linking preserved UID,
        remove temporary anonymous branch.
        */

        if (
            oldAnonymousUid &&
            firebaseUser.uid ===
            oldAnonymousUid
        ) {

            try {

                await remove(

                    ref(

                        database,

                        "anonymousUsers/" +
                        oldAnonymousUid

                    )

                );

            }

            catch (error) {

                console.warn(
                    "Anonymous cleanup:",
                    error
                );

            }

        }


        updateGoogleButton();


        if (
            noteOverlay.classList.contains(
                "show"
            )
        ) {

            await loadNotesForPage(
                currentPage
            );

        }

    }

    catch (error) {

        console.error(
            "Google Login Error:",
            error
        );


        if (
            error.code !==
            "auth/popup-closed-by-user"
        ) {

            alert(

                "Google login failed.\n\n" +

                (
                    error.code ||
                    error.message ||
                    ""
                )

            );

        }


        updateGoogleButton();

    }

    finally {

        if (
            !isGoogleUser()
        ) {

            googleBtn.disabled =
                false;

        }

    }

}


/* =====================================================
   POPUP POSITION
===================================================== */

let popupX =
    0;


let popupY =
    0;


function updatePopupTransform() {

    notePopup.style.transform =

        `translate3d(${
            popupX
        }px, ${
            popupY
        }px, 0)`;

}


function resetPopupPosition() {

    popupX =
        0;


    popupY =
        0;


    updatePopupTransform();

}


/* =====================================================
   OPEN FORM
===================================================== */

async function openPopup() {

    resetPopupPosition();


    notePopup.scrollTop =
        0;


    noteOverlay.classList.add(
        "show"
    );


    await loadNotesForPage(
        currentPage
    );

}


/* =====================================================
   CLOSE FORM
===================================================== */

function closePopup() {

    document.activeElement?.blur();


    clearTimeout(
        autoSaveTimer
    );


    /*
    Flush last text to Firebase.
    */

    savePageToFirebase(

        currentPage,

        true,

        getFormValues()

    );


    stopPageListener();


    noteOverlay.classList.remove(
        "show"
    );

}


/* =====================================================
   DRAG POPUP
===================================================== */

let draggingPopup =
    false;


let dragPointerId =
    null;


let dragStartX =
    0;


let dragStartY =
    0;


let popupStartX =
    0;


let popupStartY =
    0;


let startPopupRect =
    null;


noteHeader.addEventListener(

    "pointerdown",

    event => {

        if (
            event.target.closest(
                "button"
            )
        ) {

            return;

        }


        draggingPopup =
            true;


        dragPointerId =
            event.pointerId;


        dragStartX =
            event.clientX;


        dragStartY =
            event.clientY;


        popupStartX =
            popupX;


        popupStartY =
            popupY;


        startPopupRect =
            notePopup
                .getBoundingClientRect();


        noteHeader.classList.add(
            "dragging"
        );


        noteHeader.setPointerCapture(
            event.pointerId
        );


        event.preventDefault();

    }

);


noteHeader.addEventListener(

    "pointermove",

    event => {

        if (
            !draggingPopup ||
            event.pointerId !==
            dragPointerId
        ) {

            return;

        }


        const dx =

            event.clientX -

            dragStartX;


        const dy =

            event.clientY -

            dragStartY;


        const leftLimit =

            4 -

            startPopupRect.left;


        const rightLimit =

            window.innerWidth -

            4 -

            startPopupRect.right;


        const topLimit =

            4 -

            startPopupRect.top;


        const bottomLimit =

            window.innerHeight -

            44 -

            startPopupRect.bottom;


        const safeDX =
            Math.max(

                leftLimit,

                Math.min(

                    rightLimit,

                    dx

                )

            );


        const safeDY =
            Math.max(

                topLimit,

                Math.min(

                    bottomLimit,

                    dy

                )

            );


        popupX =

            popupStartX +

            safeDX;


        popupY =

            popupStartY +

            safeDY;


        updatePopupTransform();

    }

);


function stopPopupDrag(
    event
) {

    if (
        !draggingPopup ||
        event.pointerId !==
        dragPointerId
    ) {

        return;

    }


    draggingPopup =
        false;


    dragPointerId =
        null;


    noteHeader.classList.remove(
        "dragging"
    );

}


noteHeader.addEventListener(
    "pointerup",
    stopPopupDrag
);


noteHeader.addEventListener(
    "pointercancel",
    stopPopupDrag
);


/* =====================================================
   SCREENSHOT NAME
===================================================== */

function screenshotFilename() {

    const date =
        new Date();


    const pad =
        number =>

            String(number)
                .padStart(
                    2,
                    "0"
                );


    return (

        "ពេលសៀមស្ងាត់-" +

        date.getFullYear() +

        "-" +

        pad(
            date.getMonth() +
            1
        ) +

        "-" +

        pad(
            date.getDate()
        ) +

        "-" +

        pad(
            date.getHours()
        ) +

        "-" +

        pad(
            date.getMinutes()
        ) +

        ".png"

    );

}


/* =====================================================
   DOWNLOAD
===================================================== */

function downloadBlob(
    blob,
    filename
) {

    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(

        () => {

            URL.revokeObjectURL(
                url
            );

        },

        3000

    );

}


/* =====================================================
   WHOLE SCREEN SCREENSHOT
===================================================== */

async function captureScreen() {

    if (
        typeof window.html2canvas !==
        "function"
    ) {

        setStatus(
            "មិនអាចថតរូបបាន"
        );


        return;

    }


    captureNote.disabled =
        true;


    document.activeElement?.blur();


    try {

        if (
            document.fonts?.ready
        ) {

            await document.fonts.ready;

        }


        await new Promise(

            resolve =>

                setTimeout(
                    resolve,
                    300
                )

        );


        const screenshot =
            await window.html2canvas(

                document.documentElement,

                {

                    backgroundColor:
                        "#d8d8d8",

                    scale:
                        Math.min(

                            window.devicePixelRatio ||
                            1,

                            2

                        ),

                    useCORS:
                        true,

                    allowTaint:
                        true,

                    logging:
                        false,

                    width:
                        window.innerWidth,

                    height:
                        window.innerHeight,

                    windowWidth:
                        window.innerWidth,

                    windowHeight:
                        window.innerHeight,

                    scrollX:
                        0,

                    scrollY:
                        0

                }

            );


        const blob =
            await new Promise(

                resolve =>

                    screenshot.toBlob(

                        resolve,

                        "image/png",

                        1

                    )

            );


        if (!blob) {

            throw new Error(
                "PNG failed"
            );

        }


        const filename =
            screenshotFilename();


        const isIOS =

            /iPad|iPhone|iPod/i
                .test(
                    navigator.userAgent
                );


        if (

            isIOS &&

            navigator.share &&

            navigator.canShare

        ) {

            const file =
                new File(

                    [blob],

                    filename,

                    {
                        type:
                            "image/png"
                    }

                );


            if (

                navigator.canShare({

                    files:
                        [file]

                })

            ) {

                await navigator.share({

                    files:
                        [file],

                    title:
                        "ពេលសៀមស្ងាត់"

                });

            }

            else {

                downloadBlob(
                    blob,
                    filename
                );

            }

        }

        else {

            downloadBlob(
                blob,
                filename
            );

        }


        setStatus(
            "✓ បានថតរូប"
        );

    }

    catch (error) {

        console.error(
            "Screenshot:",
            error
        );


        setStatus(
            "មិនអាចថតរូបបាន"
        );

    }

    finally {

        captureNote.disabled =
            false;

    }

}

loadPDF();
