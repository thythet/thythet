<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<title>PDF Viewer</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, "Noto Sans Khmer", sans-serif;
    user-select: none;
    -webkit-user-select: none;
}


/* =========================
   PDF VIEWER
========================= */

#viewer {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    touch-action: none;
}

#pdfCanvas {
    display: block;

    max-width: 100%;
    max-height: 100%;

    background: #fff;

    transform: translateX(0);

    transition:
        transform 0.16s ease,
        opacity 0.16s ease;
}


/* =========================
   PAGE ANIMATION
========================= */

.slide-left {
    transform: translateX(-28px) !important;
    opacity: 0.45;
}

.slide-right {
    transform: translateX(28px) !important;
    opacity: 0.45;
}


/* =========================
   WRITE BUTTON
========================= */

#writeBtn {
    position: fixed;

    top: calc(12px + env(safe-area-inset-top));
    right: 12px;

    z-index: 50;

    height: 42px;

    padding: 0 17px;

    border: none;
    border-radius: 22px;

    background: rgba(0, 0, 0, 0.55);
    color: #fff;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

#writeBtn:active {
    transform: scale(0.95);
}


/* saved indicator */

#savedDot {
    display: none;

    position: absolute;

    width: 7px;
    height: 7px;

    top: 5px;
    right: 5px;

    border-radius: 50%;

    background: #4ade80;
}

#savedDot.show {
    display: block;
}


/* =========================
   NAVIGATION BUTTONS
========================= */

.navBtn {
    position: fixed;

    top: 50%;
    transform: translateY(-50%);

    width: 42px;
    height: 64px;

    border: none;
    outline: none;

    border-radius: 12px;

    background: rgba(0,0,0,0.28);
    color: #fff;

    font-size: 30px;

    z-index: 20;

    cursor: pointer;

    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}

.navBtn:active {
    transform: translateY(-50%) scale(0.9);
}

#prevBtn {
    left: 8px;
}

#nextBtn {
    right: 8px;
}

.navBtn.hidden {
    opacity: 0;
    pointer-events: none;
}


/* =========================
   PAGE NUMBER
========================= */

#pageInfo {
    position: fixed;

    left: 50%;

    bottom:
        calc(12px + env(safe-area-inset-bottom));

    transform: translateX(-50%);

    z-index: 20;

    padding: 6px 11px;

    border-radius: 20px;

    background: rgba(0,0,0,0.38);

    color: #fff;

    font-size: 12px;

    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}


/* =========================
   LOADING
========================= */

#loading {
    position: fixed;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 100;

    background: #111;
    color: #fff;
}

.spinner {
    width: 27px;
    height: 27px;

    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #fff;

    border-radius: 50%;

    animation: spin .7s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   ERROR
========================= */

#errorMessage {
    display: none;

    position: fixed;

    inset: 0;

    align-items: center;
    justify-content: center;

    padding: 25px;

    text-align: center;

    background: #111;
    color: #fff;

    z-index: 200;

    font-size: 14px;
    line-height: 1.5;
}


/* =========================
   NOTE POPUP OVERLAY
========================= */

#noteOverlay {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    padding:
        15px
        15px
        calc(15px + env(safe-area-inset-bottom));

    background: rgba(0,0,0,0.55);

    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .18s ease,
        visibility .18s ease;
}

#noteOverlay.show {
    opacity: 1;
    visibility: visible;
}


/* =========================
   NOTE FORM
========================= */

#notePopup {

    width: 100%;
    max-width: 500px;

    background: #fff;

    border-radius: 22px;

    padding: 18px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.35);

    transform: translateY(30px);

    transition: transform .2s ease;
}

#noteOverlay.show #notePopup {
    transform: translateY(0);
}


/* popup header */

.noteHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 13px;
}

.noteTitle {
    color: #111;

    font-size: 18px;
    font-weight: 700;
}

#closeNote {
    width: 38px;
    height: 38px;

    border: none;

    border-radius: 50%;

    background: #eee;

    color: #222;

    font-size: 22px;

    cursor: pointer;
}


/* textarea */

#noteText {
    width: 100%;

    min-height: 190px;
    max-height: 45vh;

    resize: none;

    padding: 14px;

    border: 1px solid #ddd;

    border-radius: 14px;

    outline: none;

    background: #fafafa;

    color: #111;

    font-family: inherit;

    font-size: 16px;
    line-height: 1.6;

    user-select: text;
    -webkit-user-select: text;
}

#noteText:focus {
    border-color: #777;
    background: #fff;
}


/* status */

#noteStatus {
    min-height: 19px;

    margin-top: 8px;

    color: #777;

    font-size: 12px;
}


/* buttons */

.noteActions {
    display: flex;

    gap: 9px;

    margin-top: 13px;
}

.noteActionBtn {
    height: 46px;

    border: none;

    border-radius: 13px;

    font-family: inherit;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;
}

#deleteNote {
    width: 90px;

    background: #eee;
    color: #555;
}

#saveNote {
    flex: 1;

    background: #111;
    color: #fff;
}

.noteActionBtn:active {
    transform: scale(.97);
}


/* =========================
   SMALL SCREEN
========================= */

@media (min-width: 600px) {

    #noteOverlay {
        align-items: center;
    }

}

</style>
</head>

<body>


<!-- PDF -->
<div id="viewer">
    <canvas id="pdfCanvas"></canvas>
</div>


<!-- WRITE BUTTON -->
<button id="writeBtn" type="button">
    សរសេរ
    <span id="savedDot"></span>
</button>


<!-- PREVIOUS -->
<button
    id="prevBtn"
    class="navBtn"
    type="button"
    aria-label="Previous page"
>
    &#8249;
</button>


<!-- NEXT -->
<button
    id="nextBtn"
    class="navBtn"
    type="button"
    aria-label="Next page"
>
    &#8250;
</button>


<!-- PAGE NUMBER -->
<div id="pageInfo">
    1 / 1
</div>


<!-- LOADING -->
<div id="loading">
    <div class="spinner"></div>
</div>


<!-- ERROR -->
<div id="errorMessage">
    Cannot load PDF.
</div>


<!-- =========================
     NOTE POPUP
========================= -->

<div id="noteOverlay">

    <div id="notePopup">

        <div class="noteHeader">

            <div class="noteTitle">
                សរសេរ
            </div>

            <button
                id="closeNote"
                type="button"
                aria-label="Close"
            >
                &times;
            </button>

        </div>


        <textarea
            id="noteText"
            placeholder="សរសេរនៅទីនេះ..."
        ></textarea>


        <div id="noteStatus">
            រក្សាទុកក្នុងឧបករណ៍នេះរយៈពេល 24 ម៉ោង
        </div>


        <div class="noteActions">

            <button
                id="deleteNote"
                class="noteActionBtn"
                type="button"
            >
                លុប
            </button>

            <button
                id="saveNote"
                class="noteActionBtn"
                type="button"
            >
                រក្សាទុក
            </button>

        </div>

    </div>

</div>



<script type="module">


/* ==================================================
   PDF.JS
================================================== */

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/* ==================================================
   PDF FILE

   Same folder:

   qt/
      index.html
      09-12-2026.pdf

================================================== */

const PDF_URL = "09-12-2026.pdf";


/* ==================================================
   PDF ELEMENTS
================================================== */

const viewer =
    document.getElementById("viewer");

const canvas =
    document.getElementById("pdfCanvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false
        }
    );

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const pageInfo =
    document.getElementById("pageInfo");

const loading =
    document.getElementById("loading");

const errorMessage =
    document.getElementById("errorMessage");


/* ==================================================
   PDF VARIABLES
================================================== */

let pdfDocument = null;

let currentPage = 1;

let rendering = false;

let requestedPage = null;

let renderTask = null;

let resizeTimer = null;


/* ==================================================
   LOAD PDF
================================================== */

async function loadPDF() {

    try {

        const loadingTask =
            pdfjsLib.getDocument({

                url: PDF_URL,

                disableAutoFetch: false,
                disableStream: false,
                disableRange: false

            });


        pdfDocument =
            await loadingTask.promise;


        loading.style.display = "none";


        renderPage(1);

    }

    catch (error) {

        console.error(
            "PDF loading error:",
            error
        );


        loading.style.display = "none";

        errorMessage.style.display =
            "flex";


        errorMessage.innerHTML =
            "Cannot load PDF.<br><br>" +
            "Make sure <b>09-12-2026.pdf</b> " +
            "is in the same folder as index.html.";

    }

}


/* ==================================================
   RENDER PAGE
================================================== */

async function renderPage(pageNumber) {

    if (!pdfDocument) return;


    pageNumber =
        Math.max(
            1,
            Math.min(
                pageNumber,
                pdfDocument.numPages
            )
        );


    if (rendering) {

        requestedPage =
            pageNumber;

        return;
    }


    rendering = true;


    try {

        const page =
            await pdfDocument.getPage(
                pageNumber
            );


        const originalViewport =
            page.getViewport({
                scale: 1
            });


        const screenWidth =
            viewer.clientWidth;

        const screenHeight =
            viewer.clientHeight;


        const widthScale =
            screenWidth /
            originalViewport.width;

        const heightScale =
            screenHeight /
            originalViewport.height;


        const cssScale =
            Math.min(
                widthScale,
                heightScale
            );


        const dpr =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );


        const renderScale =
            cssScale * dpr;


        const viewport =
            page.getViewport({
                scale: renderScale
            });


        canvas.width =
            Math.floor(
                viewport.width
            );

        canvas.height =
            Math.floor(
                viewport.height
            );


        canvas.style.width =
            Math.floor(
                viewport.width / dpr
            ) + "px";


        canvas.style.height =
            Math.floor(
                viewport.height / dpr
            ) + "px";


        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        renderTask =
            page.render({

                canvasContext: ctx,

                viewport: viewport

            });


        await renderTask.promise;


        renderTask = null;

        currentPage =
            pageNumber;


        updatePDFUI();

    }

    catch (error) {

        if (
            error?.name !==
            "RenderingCancelledException"
        ) {

            console.error(
                error
            );

        }

    }

    finally {

        rendering = false;


        if (
            requestedPage !== null &&
            requestedPage !== currentPage
        ) {

            const page =
                requestedPage;

            requestedPage = null;

            renderPage(page);

        }

        else {

            requestedPage = null;

        }

    }

}


/* ==================================================
   UPDATE PDF UI
================================================== */

function updatePDFUI() {

    if (!pdfDocument) return;


    pageInfo.textContent =
        currentPage +
        " / " +
        pdfDocument.numPages;


    prevBtn.classList.toggle(
        "hidden",
        currentPage <= 1
    );


    nextBtn.classList.toggle(
        "hidden",
        currentPage >=
        pdfDocument.numPages
    );

}


/* ==================================================
   PAGE NAVIGATION
================================================== */

function nextPage() {

    if (!pdfDocument) return;


    if (
        currentPage <
        pdfDocument.numPages
    ) {

        animatePage("left");

        renderPage(
            currentPage + 1
        );

    }

}


function previousPage() {

    if (!pdfDocument) return;


    if (currentPage > 1) {

        animatePage("right");

        renderPage(
            currentPage - 1
        );

    }

}


/* ==================================================
   ANIMATION
================================================== */

function animatePage(direction) {

    canvas.classList.remove(
        "slide-left",
        "slide-right"
    );


    if (direction === "left") {

        canvas.classList.add(
            "slide-left"
        );

    }

    else {

        canvas.classList.add(
            "slide-right"
        );

    }


    setTimeout(() => {

        canvas.classList.remove(
            "slide-left",
            "slide-right"
        );

    }, 160);

}


/* buttons */

nextBtn.addEventListener(
    "click",
    nextPage
);


prevBtn.addEventListener(
    "click",
    previousPage
);


/* ==================================================
   SWIPE
================================================== */

let touchStartX = 0;
let touchStartY = 0;
let touching = false;


viewer.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !== 1
        ) return;


        touching = true;


        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


viewer.addEventListener(
    "touchmove",
    event => {

        if (!touching) return;


        const currentX =
            event.touches[0].clientX;


        const difference =
            currentX -
            touchStartX;


        const movement =
            Math.max(
                -35,
                Math.min(
                    35,
                    difference * 0.15
                )
            );


        canvas.style.transform =
            `translateX(${movement}px)`;

    },
    {
        passive: true
    }
);


viewer.addEventListener(
    "touchend",
    event => {

        if (!touching) return;


        touching = false;


        canvas.style.transform =
            "translateX(0)";


        const endX =
            event.changedTouches[0]
                .clientX;

        const endY =
            event.changedTouches[0]
                .clientY;


        const distanceX =
            endX -
            touchStartX;

        const distanceY =
            endY -
            touchStartY;


        if (
            Math.abs(distanceX) > 45 &&
            Math.abs(distanceX) >
            Math.abs(distanceY)
        ) {

            if (distanceX < 0) {

                nextPage();

            }

            else {

                previousPage();

            }

        }

    },
    {
        passive: true
    }
);


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener(
    "keydown",
    event => {

        /*
        Don't change PDF page while
        user is writing.
        */

        if (
            document.activeElement ===
            noteText
        ) return;


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextPage();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousPage();

        }

    }
);


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    if (pdfDocument) {

                        renderPage(
                            currentPage
                        );

                    }

                },
                180
            );

    }
);


/* ==================================================
   LOCAL 24-HOUR NOTE SYSTEM
================================================== */

const STORAGE_KEY =
    "qt_local_note_v1";


const STORAGE_TIME =
    24 * 60 * 60 * 1000;


/* elements */

const writeBtn =
    document.getElementById(
        "writeBtn"
    );

const savedDot =
    document.getElementById(
        "savedDot"
    );

const noteOverlay =
    document.getElementById(
        "noteOverlay"
    );

const closeNote =
    document.getElementById(
        "closeNote"
    );

const noteText =
    document.getElementById(
        "noteText"
    );

const noteStatus =
    document.getElementById(
        "noteStatus"
    );

const saveNote =
    document.getElementById(
        "saveNote"
    );

const deleteNote =
    document.getElementById(
        "deleteNote"
    );


/* ==================================================
   GET SAVED NOTE
================================================== */

function getSavedNote() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            savedDot.classList.remove(
                "show"
            );

            return null;
        }


        const data =
            JSON.parse(saved);


        /*
        If expired:
        delete automatically.
        */

        if (
            !data.expires ||
            Date.now() >= data.expires
        ) {

            localStorage.removeItem(
                STORAGE_KEY
            );


            savedDot.classList.remove(
                "show"
            );


            return null;

        }


        savedDot.classList.add(
            "show"
        );


        return data;

    }

    catch (error) {

        localStorage.removeItem(
            STORAGE_KEY
        );

        return null;

    }

}


/* ==================================================
   OPEN POPUP
================================================== */

function openNotePopup() {

    const data =
        getSavedNote();


    if (data) {

        noteText.value =
            data.text || "";


        const hoursLeft =
            Math.max(
                0,
                Math.ceil(
                    (
                        data.expires -
                        Date.now()
                    ) /
                    3600000
                )
            );


        noteStatus.textContent =
            "បានរក្សាទុក • នៅសល់ប្រហែល " +
            hoursLeft +
            " ម៉ោង";

    }

    else {

        noteText.value =
            "";


        noteStatus.textContent =
            "រក្សាទុកក្នុងឧបករណ៍នេះរយៈពេល 24 ម៉ោង";

    }


    noteOverlay.classList.add(
        "show"
    );


    setTimeout(
        () => {

            noteText.focus();

        },
        200
    );

}


/* ==================================================
   CLOSE POPUP
================================================== */

function closeNotePopup() {

    noteOverlay.classList.remove(
        "show"
    );


    noteText.blur();

}


/* ==================================================
   SAVE NOTE
================================================== */

function saveLocalNote() {

    const text =
        noteText.value.trim();


    if (!text) {

        noteStatus.textContent =
            "សូមសរសេរអត្ថបទមុនរក្សាទុក";

        return;

    }


    const now =
        Date.now();


    const data = {

        text: text,

        savedAt: now,

        expires:
            now + STORAGE_TIME

    };


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );


        savedDot.classList.add(
            "show"
        );


        noteStatus.textContent =
            "✓ បានរក្សាទុករយៈពេល 24 ម៉ោង";


        saveNote.textContent =
            "បានរក្សាទុក";


        setTimeout(
            () => {

                saveNote.textContent =
                    "រក្សាទុក";

            },
            1000
        );

    }

    catch (error) {

        console.error(error);


        noteStatus.textContent =
            "មិនអាចរក្សាទុកបាន";

    }

}


/* ==================================================
   DELETE NOTE
================================================== */

function deleteLocalNote() {

    localStorage.removeItem(
        STORAGE_KEY
    );


    noteText.value =
        "";


    savedDot.classList.remove(
        "show"
    );


    noteStatus.textContent =
        "បានលុបអត្ថបទ";


    setTimeout(
        () => {

            noteStatus.textContent =
                "រក្សាទុកក្នុងឧបករណ៍នេះរយៈពេល 24 ម៉ោង";

        },
        1200
    );

}


/* ==================================================
   NOTE EVENTS
================================================== */

writeBtn.addEventListener(
    "click",
    openNotePopup
);


closeNote.addEventListener(
    "click",
    closeNotePopup
);


saveNote.addEventListener(
    "click",
    saveLocalNote
);


deleteNote.addEventListener(
    "click",
    deleteLocalNote
);


/*
Tap dark background to close.
*/

noteOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            noteOverlay
        ) {

            closeNotePopup();

        }

    }
);


/*
Escape key
*/

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            closeNotePopup();

        }

    }
);


/* ==================================================
   CHECK EXPIRED NOTE
================================================== */

getSavedNote();


/*
Check once every minute
while page is open.
*/

setInterval(
    () => {

        getSavedNote();

    },
    60000
);


/* ==================================================
   START PDF
================================================== */

loadPDF();

</script>

</body>
</html>
