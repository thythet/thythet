<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<title>ពេលសៀមស្ងាត់</title>

<style>

/* =====================================================
   KRASAR FONT
===================================================== */

@font-face {
    font-family: "Krasar";
    src: url("https://thythet.com/prayinfo2/assets/fonts/Krasar.woff") format("woff");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}


/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #d8d8d8;

    font-family: "Krasar", sans-serif;
}


/* =====================================================
   PDF
===================================================== */

#viewer {
    position: fixed;
    inset: 0;

    overflow: auto;

    -webkit-overflow-scrolling: touch;

    background: #d8d8d8;

    overscroll-behavior: contain;
}

#pageContainer {
    min-width: 100%;
    min-height: 100%;

    display: flex;

    justify-content: center;
    align-items: flex-start;
}

#pdfCanvas {
    display: block;

    background: white;

    transform-origin: top center;

    box-shadow:
        0 0 7px rgba(0,0,0,.18);
}


/* =====================================================
   WRITE BUTTON
===================================================== */

#writeBtn {
    position: fixed;

    top: calc(8px + env(safe-area-inset-top));
    right: 8px;

    z-index: 100;

    height: 38px;

    padding: 0 14px;

    border: 0;
    border-radius: 20px;

    background: rgba(0,0,0,.7);

    color: white;

    font-family: "Krasar", sans-serif;
    font-size: 14px;

    cursor: pointer;
}

#savedDot {
    display: none;

    position: absolute;

    top: 4px;
    right: 4px;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #35d66f;
}

#savedDot.show {
    display: block;
}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

.navBtn {
    position: fixed;

    top: 50%;

    transform: translateY(-50%);

    z-index: 80;

    width: 38px;
    height: 58px;

    border: 0;

    border-radius: 11px;

    background: rgba(0,0,0,.25);

    color: white;

    font-size: 28px;
}

#prevBtn {
    left: 5px;
}

#nextBtn {
    right: 5px;
}

.navBtn.hidden {
    opacity: 0;
    pointer-events: none;
}


/* =====================================================
   PAGE NUMBER
===================================================== */

#pageInfo {
    position: fixed;

    left: 50%;

    bottom: calc(7px + env(safe-area-inset-bottom));

    transform: translateX(-50%);

    z-index: 80;

    padding: 4px 9px;

    border-radius: 14px;

    background: rgba(0,0,0,.5);

    color: white;

    font-size: 10px;

    pointer-events: none;
}


/* =====================================================
   ZOOM INFO
===================================================== */

#zoomInfo {
    position: fixed;

    top: calc(10px + env(safe-area-inset-top));
    left: 8px;

    z-index: 80;

    padding: 4px 8px;

    border-radius: 12px;

    background: rgba(0,0,0,.5);

    color: white;

    font-size: 10px;

    opacity: 0;

    pointer-events: none;

    transition: opacity .15s;
}

#zoomInfo.show {
    opacity: 1;
}


/* =====================================================
   LOADING
===================================================== */

#loading {
    position: fixed;
    inset: 0;

    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111;
}

.spinner {
    width: 25px;
    height: 25px;

    border: 3px solid rgba(255,255,255,.2);
    border-top-color: white;

    border-radius: 50%;

    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =====================================================
   ERROR
===================================================== */

#errorMessage {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 600;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background: #111;
    color: white;

    text-align: center;
}


/* =====================================================
   FORM OVERLAY
   BOTTOM ALIGNED
   NO BLUR
===================================================== */

#noteOverlay {
    position: fixed;
    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    padding:
        calc(6px + env(safe-area-inset-top))
        7px
        calc(48px + env(safe-area-inset-bottom));

    background: rgba(0,0,0,.08);

    backdrop-filter: none;
    -webkit-backdrop-filter: none;

    opacity: 0;
    visibility: hidden;

    transition: opacity .15s;
}

#noteOverlay.show {
    opacity: 1;
    visibility: visible;
}


/* =====================================================
   POPUP
===================================================== */

#notePopup {
    width: 100%;
    max-width: 520px;

    max-height: 96%;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    padding: 9px;

    border-radius: 16px;

    background: rgba(255,255,255,.96);

    box-shadow:
        0 5px 20px rgba(0,0,0,.22);
}


/* =====================================================
   HEADER
===================================================== */

.noteHeader {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 7px;
}

.formTitle {
    font-size: 15px;
    font-weight: bold;

    color: #111;
}

#closeNote {
    width: 31px;
    height: 31px;

    border: 0;

    border-radius: 50%;

    background: #eee;

    color: #333;

    font-size: 19px;
}


/* =====================================================
   QUESTION GROUP
===================================================== */

.noteGroup {
    margin-bottom: 6px;
}


/* USER REQUESTED CLASS */

.noteTitle {
    display: block;

    margin-bottom: 2px;

    color: #079447;

    font-family: "Krasar", sans-serif;

    font-size: 13px;
    font-weight: bold;

    line-height: 1.35;
}


/* =====================================================
   COMPACT AUTO GROW INPUT
===================================================== */

.noteInput {
    display: block;

    width: 100%;

    height: 39px;
    min-height: 39px;

    overflow-y: hidden;

    resize: none;

    padding: 6px 8px;

    border: 1px solid #d2d2d2;
    border-radius: 8px;

    outline: none;

    background: rgba(255,255,255,.92);

    color: #111;

    font-family: "Krasar", sans-serif;

    font-size: 13px;

    line-height: 1.45;

    user-select: text;
    -webkit-user-select: text;

    transition:
        border-color .1s;
}

.noteInput:focus {
    border-color: #079447;
}


/* =====================================================
   STATUS
===================================================== */

#noteStatus {
    min-height: 14px;

    margin-top: 2px;
    margin-bottom: 5px;

    color: #777;

    font-size: 9.5px;

    line-height: 1.3;
}


/* =====================================================
   BUTTONS
===================================================== */

.noteActions {
    display: flex;

    gap: 6px;

    margin-top: 3px;
}

.noteActionBtn {
    height: 39px;

    border: 0;

    border-radius: 9px;

    font-family: "Krasar", sans-serif;

    font-size: 13px;

    cursor: pointer;
}

#deleteNote {
    width: 74px;

    background: #eee;

    color: #555;
}

#saveNote {
    flex: 1;

    background: #111;

    color: white;
}

</style>
</head>


<body>

        រក្សាទុកក្នុងឧបករណ៍នេះរយៈពេល 24 ម៉ោង

<script type="module">


/* =====================================================
   PDF.JS
===================================================== */

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


const PDF_URL =
    "09-12-2026.pdf";


/* =====================================================
   PDF ELEMENTS
===================================================== */

const viewer =
    document.getElementById("viewer");

const pageContainer =
    document.getElementById("pageContainer");

const canvas =
    document.getElementById("pdfCanvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const pageInfo =
    document.getElementById("pageInfo");

const zoomInfo =
    document.getElementById("zoomInfo");

const loading =
    document.getElementById("loading");

const errorMessage =
    document.getElementById("errorMessage");


/* =====================================================
   PDF STATE
===================================================== */

let pdfDocument = null;

let currentPage = 1;

let rendering = false;

let pendingPage = null;

let zoom = 1;

const MIN_ZOOM = 1;
const MAX_ZOOM = 4;


/* =====================================================
   LOAD PDF
===================================================== */

async function loadPDF() {

    try {

        const task =
            pdfjsLib.getDocument({
                url: PDF_URL,
                disableAutoFetch: false,
                disableStream: false,
                disableRange: false
            });


        pdfDocument =
            await task.promise;


        loading.style.display =
            "none";


        renderPage(1);

    }

    catch (error) {

        console.error(error);


        loading.style.display =
            "none";


        errorMessage.style.display =
            "flex";


        errorMessage.innerHTML =
            "Cannot load PDF.<br><br>" +
            "Make sure 09-12-2026.pdf is in the same folder.";

    }

}


/* =====================================================
   RENDER PAGE
===================================================== */

async function renderPage(pageNumber) {

    if (!pdfDocument) return;


    pageNumber =
        Math.max(
            1,
            Math.min(
                pageNumber,
                pdfDocument.numPages
            )
        );


    if (rendering) {

        pendingPage =
            pageNumber;

        return;

    }


    rendering = true;


    try {

        const page =
            await pdfDocument.getPage(
                pageNumber
            );


        const original =
            page.getViewport({
                scale: 1
            });


        const baseScale =
            viewer.clientWidth /
            original.width;


        const cssScale =
            baseScale * zoom;


        const dpr =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );


        const viewport =
            page.getViewport({
                scale:
                    cssScale * dpr
            });


        canvas.width =
            Math.floor(
                viewport.width
            );


        canvas.height =
            Math.floor(
                viewport.height
            );


        canvas.style.width =
            Math.floor(
                viewport.width /
                dpr
            ) + "px";


        canvas.style.height =
            Math.floor(
                viewport.height /
                dpr
            ) + "px";


        pageContainer.style.width =
            Math.max(
                viewer.clientWidth,
                viewport.width / dpr
            ) + "px";


        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const renderTask =
            page.render({

                canvasContext: ctx,

                viewport: viewport

            });


        await renderTask.promise;


        currentPage =
            pageNumber;


        updateUI();

    }

    catch (error) {

        console.error(error);

    }

    finally {

        rendering = false;


        if (
            pendingPage !== null &&
            pendingPage !== currentPage
        ) {

            const p =
                pendingPage;

            pendingPage =
                null;

            renderPage(p);

        }

        else {

            pendingPage =
                null;

        }

    }

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    pageInfo.textContent =
        currentPage +
        " / " +
        pdfDocument.numPages;


    prevBtn.classList.toggle(
        "hidden",
        currentPage <= 1
    );


    nextBtn.classList.toggle(
        "hidden",
        currentPage >= pdfDocument.numPages
    );

}


/* =====================================================
   PAGE NAV
===================================================== */

function nextPage() {

    if (!pdfDocument) return;


    if (
        currentPage <
        pdfDocument.numPages
    ) {

        zoom = 1;

        viewer.scrollTop = 0;
        viewer.scrollLeft = 0;

        renderPage(
            currentPage + 1
        );

    }

}


function previousPage() {

    if (!pdfDocument) return;


    if (currentPage > 1) {

        zoom = 1;

        viewer.scrollTop = 0;
        viewer.scrollLeft = 0;

        renderPage(
            currentPage - 1
        );

    }

}


nextBtn.addEventListener(
    "click",
    nextPage
);

prevBtn.addEventListener(
    "click",
    previousPage
);


/* =====================================================
   SWIPE + PINCH ZOOM
===================================================== */

let touchStartX = 0;
let touchStartY = 0;

let singleTouch = false;

let isPinching = false;

let pinchStartDistance = 0;
let pinchStartZoom = 1;

let pinchPreviewZoom = 1;


/* distance */

function getDistance(touches) {

    const x =
        touches[0].clientX -
        touches[1].clientX;

    const y =
        touches[0].clientY -
        touches[1].clientY;


    return Math.sqrt(
        x * x +
        y * y
    );

}


/* START */

viewer.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length === 2
        ) {

            isPinching = true;

            singleTouch = false;


            pinchStartDistance =
                getDistance(
                    event.touches
                );


            pinchStartZoom =
                zoom;


            pinchPreviewZoom =
                zoom;


            return;

        }


        if (
            event.touches.length === 1
        ) {

            singleTouch = true;


            touchStartX =
                event.touches[0]
                    .clientX;


            touchStartY =
                event.touches[0]
                    .clientY;

        }

    },
    {
        passive: true
    }
);


/* MOVE */

viewer.addEventListener(
    "touchmove",
    event => {

        if (
            isPinching &&
            event.touches.length === 2
        ) {

            event.preventDefault();


            const distance =
                getDistance(
                    event.touches
                );


            let newZoom =
                pinchStartZoom *
                (
                    distance /
                    pinchStartDistance
                );


            newZoom =
                Math.max(
                    MIN_ZOOM,
                    Math.min(
                        MAX_ZOOM,
                        newZoom
                    )
                );


            pinchPreviewZoom =
                newZoom;


            const preview =
                newZoom / zoom;


            canvas.style.transform =
                `scale(${preview})`;


            zoomInfo.textContent =
                Math.round(
                    newZoom * 100
                ) + "%";


            zoomInfo.classList.add(
                "show"
            );

        }

    },
    {
        passive: false
    }
);


/* END */

viewer.addEventListener(
    "touchend",
    event => {

        if (isPinching) {

            if (
                event.touches.length < 2
            ) {

                zoom =
                    pinchPreviewZoom;


                canvas.style.transform =
                    "none";


                isPinching =
                    false;


                renderPage(
                    currentPage
                );


                setTimeout(
                    () => {

                        zoomInfo.classList.remove(
                            "show"
                        );

                    },
                    600
                );

            }


            return;

        }


        if (
            !singleTouch ||
            zoom > 1.05 ||
            !event.changedTouches.length
        ) {

            singleTouch = false;

            return;

        }


        const endX =
            event.changedTouches[0]
                .clientX;


        const endY =
            event.changedTouches[0]
                .clientY;


        const dx =
            endX -
            touchStartX;


        const dy =
            endY -
            touchStartY;


        if (
            Math.abs(dx) > 65 &&
            Math.abs(dx) >
            Math.abs(dy) * 1.4
        ) {

            if (dx < 0) {

                nextPage();

            }

            else {

                previousPage();

            }

        }


        singleTouch =
            false;

    },
    {
        passive: true
    }
);


/* =====================================================
   DOUBLE TAP = RESET ZOOM
===================================================== */

let lastTap = 0;


viewer.addEventListener(
    "touchend",
    event => {

        if (
            event.changedTouches.length !== 1 ||
            isPinching
        ) return;


        const now =
            Date.now();


        if (
            now - lastTap <
            280
        ) {

            zoom = 1;


            viewer.scrollTop = 0;
            viewer.scrollLeft = 0;


            renderPage(
                currentPage
            );


            zoomInfo.textContent =
                "100%";


            zoomInfo.classList.add(
                "show"
            );


            setTimeout(
                () => {

                    zoomInfo.classList.remove(
                        "show"
                    );

                },
                500
            );

        }


        lastTap =
            now;

    },
    {
        passive: true
    }
);


/* =====================================================
   RESIZE
===================================================== */

let resizeTimer;


window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    if (pdfDocument) {

                        renderPage(
                            currentPage
                        );

                    }

                },
                200
            );

    }
);


/* =====================================================
   FORM
===================================================== */

const STORAGE_KEY =
    "qt_bible_notes_v3";


const STORAGE_TIME =
    24 *
    60 *
    60 *
    1000;


const writeBtn =
    document.getElementById(
        "writeBtn"
    );

const savedDot =
    document.getElementById(
        "savedDot"
    );

const noteOverlay =
    document.getElementById(
        "noteOverlay"
    );

const notePopup =
    document.getElementById(
        "notePopup"
    );

const closeNote =
    document.getElementById(
        "closeNote"
    );

const note1 =
    document.getElementById("note1");

const note2 =
    document.getElementById("note2");

const note3 =
    document.getElementById("note3");

const note4 =
    document.getElementById("note4");

const note5 =
    document.getElementById("note5");

const noteStatus =
    document.getElementById(
        "noteStatus"
    );

const saveNote =
    document.getElementById(
        "saveNote"
    );

const deleteNote =
    document.getElementById(
        "deleteNote"
    );


const noteInputs =
    document.querySelectorAll(
        ".noteInput"
    );


/* =====================================================
   AUTO GROW TEXTAREA
===================================================== */

function autoGrow(textarea) {

    textarea.style.height =
        "39px";


    const newHeight =
        Math.max(
            39,
            textarea.scrollHeight
        );


    textarea.style.height =
        newHeight + "px";

}


/* grow while typing */

noteInputs.forEach(
    textarea => {

        textarea.addEventListener(
            "input",
            () => {

                autoGrow(
                    textarea
                );

            }
        );

    }
);


/* =====================================================
   LOAD NOTES
===================================================== */

function getSavedNotes() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {

            savedDot.classList.remove(
                "show"
            );

            return null;

        }


        const data =
            JSON.parse(saved);


        if (
            !data.expires ||
            Date.now() >=
            data.expires
        ) {

            localStorage.removeItem(
                STORAGE_KEY
            );


            savedDot.classList.remove(
                "show"
            );


            return null;

        }


        savedDot.classList.add(
            "show"
        );


        return data;

    }

    catch {

        localStorage.removeItem(
            STORAGE_KEY
        );


        return null;

    }

}


/* =====================================================
   OPEN
===================================================== */

function openNotePopup() {

    const data =
        getSavedNotes();


    if (data) {

        note1.value =
            data.note1 || "";

        note2.value =
            data.note2 || "";

        note3.value =
            data.note3 || "";

        note4.value =
            data.note4 || "";

        note5.value =
            data.note5 || "";


        const hoursLeft =
            Math.max(
                1,
                Math.ceil(
                    (
                        data.expires -
                        Date.now()
                    ) /
                    3600000
                )
            );


        noteStatus.textContent =
            "បានរក្សាទុក • នៅសល់ប្រហែល " +
            hoursLeft +
            " ម៉ោង";

    }

    else {

        note1.value = "";
        note2.value = "";
        note3.value = "";
        note4.value = "";
        note5.value = "";


        noteStatus.textContent =
            "រក្សាទុកក្នុងឧបករណ៍នេះរយៈពេល 24 ម៉ោង";

    }


    noteInputs.forEach(
        textarea => {

            autoGrow(
                textarea
            );

        }
    );


    notePopup.scrollTop =
        0;


    noteOverlay.classList.add(
        "show"
    );

}


/* =====================================================
   CLOSE
===================================================== */

function closeNotePopup() {

    noteOverlay.classList.remove(
        "show"
    );


    document.activeElement?.blur();

}


/* =====================================================
   SAVE
===================================================== */

function saveLocalNotes() {

    const hasText =

        note1.value.trim() ||
        note2.value.trim() ||
        note3.value.trim() ||
        note4.value.trim() ||
        note5.value.trim();


    if (!hasText) {

        noteStatus.textContent =
            "សូមសរសេរចម្លើយយ៉ាងហោចណាស់មួយ";

        return;

    }


    const now =
        Date.now();


    const data = {

        note1:
            note1.value,

        note2:
            note2.value,

        note3:
            note3.value,

        note4:
            note4.value,

        note5:
            note5.value,

        savedAt:
            now,

        expires:
            now +
            STORAGE_TIME

    };


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );


        savedDot.classList.add(
            "show"
        );


        noteStatus.textContent =
            "✓ បានរក្សាទុក 24 ម៉ោង";


        saveNote.textContent =
            "បានរក្សាទុក";


        setTimeout(
            () => {

                saveNote.textContent =
                    "រក្សាទុក";

            },
            800
        );

    }

    catch {

        noteStatus.textContent =
            "មិនអាចរក្សាទុកបាន";

    }

}


/* =====================================================
   DELETE
===================================================== */

function deleteLocalNotes() {

    localStorage.removeItem(
        STORAGE_KEY
    );


    noteInputs.forEach(
        textarea => {

            textarea.value = "";

            autoGrow(
                textarea
            );

        }
    );


    savedDot.classList.remove(
        "show"
    );


    noteStatus.textContent =
        "បានលុបអត្ថបទ";

}


/* =====================================================
   EVENTS
===================================================== */

writeBtn.addEventListener(
    "click",
    openNotePopup
);


closeNote.addEventListener(
    "click",
    closeNotePopup
);


saveNote.addEventListener(
    "click",
    saveLocalNotes
);


deleteNote.addEventListener(
    "click",
    deleteLocalNotes
);


noteOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            noteOverlay
        ) {

            closeNotePopup();

        }

    }
);


/* =====================================================
   EXPIRE CHECK
===================================================== */

getSavedNotes();


setInterval(
    getSavedNotes,
    60000
);


/* =====================================================
   START
===================================================== */

loadPDF();

</script>
