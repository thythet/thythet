<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dff4ff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css">
<title>Tahoe Admin Dashboard Pro v23</title>
<style>
:root{
  --accent:#0b6fe8;--accent-rgb:11,111,232;
  --text:#18191c;--muted:#707277;--line:rgba(25,27,31,.075);
  --glass:rgba(255,255,255,.70);--glass-strong:rgba(255,255,255,.84);
  --sidebar-bg:rgba(224,246,253,.72);--card:rgba(247,247,248,.76);
  --window-radius:26px;--card-radius:20px;--sidebar:292px;
  --ui:1;--row-h:60px;--nav-h:40px;--blur:30px;
  --top-glass-blur:4px;--top-glass-opacity:.96;
  --top-bar-height:76px;--top-fade-depth:64px;--search-blur:18px;
  --fade-1:1;--fade-2:.50;--fade-3:0;--fade-4:0;--fade-5:0;
  --fade-pos-2:50%;--fade-pos-3:100%;--fade-pos-4:100%;
  --shadow:0 35px 95px rgba(21,49,75,.28);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html{scroll-behavior:smooth}
button,a,[role="button"],.nav-item,.row.action,.preview,.seg,.switch,.color-dot,.toolbtn,.circle-btn,.modal-close,.btn{
  -webkit-tap-highlight-color:transparent;
  tap-highlight-color:transparent;
}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid rgba(var(--accent-rgb),.42);
  outline-offset:2px;
}
body{
  margin:0;min-height:100dvh;overflow:hidden;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",sans-serif;
  background:
    radial-gradient(900px 600px at 95% 8%,rgba(0,168,255,.62),transparent 56%),
    radial-gradient(760px 560px at 5% 88%,rgba(0,106,255,.62),transparent 60%),
    linear-gradient(135deg,#439dc2 0%,#f2f7fb 48%,#0358be 100%);
}
body:before,body:after{content:"";position:fixed;border-radius:999px;filter:blur(18px);opacity:.4;pointer-events:none;z-index:0}
body:before{width:280px;height:420px;left:-115px;top:110px;background:#e9dfb1}
body:after{width:470px;height:470px;right:-110px;bottom:-210px;background:#003ac8}
.wallpaper-layer{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-repeat:no-repeat;background-position:center;background-size:cover;
  opacity:1;transition:opacity .25s var(--ease),filter .25s var(--ease);
}
.window{z-index:1}
button,input,select{font:inherit}
button{border:0;background:none;color:inherit}
svg{display:block}
.hidden{display:none!important}

/* ===== Floating macOS-style window ===== */
.window{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(1120px,calc(100vw - 54px));height:min(840px,calc(100dvh - 46px));
  display:grid;grid-template-columns:var(--sidebar) 10px minmax(0,1fr);
  border:1px solid rgba(255,255,255,.70);border-radius:var(--window-radius);
  overflow:hidden;background:rgba(255,255,255,.62);
  box-shadow:var(--shadow);
  backdrop-filter:blur(var(--blur)) saturate(145%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(145%);
  will-change:left,top,width,height,border-radius;
  transition:width .36s var(--ease),height .36s var(--ease),border-radius .25s var(--ease);
}
.window.no-anim{transition:none}
.window[data-size="compact"]{width:min(860px,calc(100vw - 38px));height:min(620px,calc(100dvh - 36px))}
.window[data-size="small"]{width:min(980px,calc(100vw - 44px));height:min(720px,calc(100dvh - 40px))}
.window[data-size="medium"]{width:min(1120px,calc(100vw - 54px));height:min(840px,calc(100dvh - 46px))}
.window[data-size="large"]{width:min(1260px,calc(100vw - 46px));height:min(920px,calc(100dvh - 34px))}
.window.dragging,.window.resizing{transition:none;user-select:none}
.window.reduce-transparency{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff}
.window.compact-ui{--row-h:54px;--nav-h:36px}
.window[data-size="custom"]{transition:border-radius .25s var(--ease)}

/* ===== Sidebar — separate rounded Tahoe glass panel ===== */
.sidebar{
  min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  margin:10px 0 10px 10px;padding:0 10px 14px;
  border-radius:max(18px,calc(var(--window-radius) - 9px));
  background:linear-gradient(180deg,rgba(222,247,255,.70),rgba(236,249,253,.60));
  backdrop-filter:blur(calc(var(--top-glass-blur) * .45)) saturate(140%);
  -webkit-backdrop-filter:blur(calc(var(--top-glass-blur) * .45)) saturate(140%);
  border:1px solid rgba(255,255,255,.48);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),0 1px 1px rgba(255,255,255,.26);
  isolation:isolate;
}
.sidebar::-webkit-scrollbar,.content::-webkit-scrollbar{display:none}
.sidebar-top{
  position:sticky;top:0;z-index:24;margin:0 -10px 0;padding:12px 10px 8px;
  background:transparent;touch-action:none;isolation:isolate;overflow:visible;
}
/* One masked glass surface: 100% at top -> 50% middle -> 0% bottom.
   No separate square blur cap, so Chrome has no hard bottom edge to reveal. */
.sidebar-top:before{
  content:"";position:absolute;z-index:0;pointer-events:none;
  left:-18px;right:-18px;top:-12px;
  height:calc(100% + var(--top-fade-depth) + 12px);
  background:linear-gradient(to bottom,
    rgba(255,255,255,var(--top-glass-opacity)) 0%,
    rgba(242,251,255,.72) 55%,
    rgba(214,239,252,.18) 100%);
  backdrop-filter:blur(var(--top-glass-blur)) saturate(165%);
  -webkit-backdrop-filter:blur(var(--top-glass-blur)) saturate(165%);
  -webkit-mask-image:linear-gradient(to bottom,
    rgba(0,0,0,var(--fade-1)) 0%,
    rgba(0,0,0,var(--fade-1)) 20%,
    rgba(0,0,0,var(--fade-2)) var(--fade-pos-2),
    rgba(0,0,0,var(--fade-3)) 100%);
  mask-image:linear-gradient(to bottom,
    rgba(0,0,0,var(--fade-1)) 0%,
    rgba(0,0,0,var(--fade-1)) 20%,
    rgba(0,0,0,var(--fade-2)) var(--fade-pos-2),
    rgba(0,0,0,var(--fade-3)) 100%);
  transform:translate3d(0,0,0);backface-visibility:hidden;
  will-change:backdrop-filter,-webkit-backdrop-filter,-webkit-mask-image,mask-image;
}
.sidebar-top:after{display:none!important}
.sidebar-top>*{position:relative;z-index:1}
.traffic{display:flex;gap:9px;height:31px;align-items:flex-start;padding:0 6px;user-select:none}
.traffic-dot{display:block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);padding:0;cursor:pointer;position:relative;overflow:hidden}
.traffic-dot:nth-child(1){background:#ff5f57}.traffic-dot:nth-child(2){background:#febc2e}.traffic-dot:nth-child(3){background:#28c840}
.traffic-dot:focus-visible{outline:2px solid rgba(var(--accent-rgb),.40);outline-offset:2px}
.search{
  height:37px;border-radius:19px;
  background:rgba(226,240,247,.46);
  backdrop-filter:blur(var(--search-blur)) saturate(155%);
  -webkit-backdrop-filter:blur(var(--search-blur)) saturate(155%);
  border:1px solid rgba(255,255,255,.34);
  box-shadow:inset 0 1px rgba(255,255,255,.34);
  display:flex;align-items:center;gap:8px;padding:0 12px;margin:0 1px;color:#62676b;
  transition:box-shadow .2s,background .2s,backdrop-filter .2s,-webkit-backdrop-filter .2s;
}
.search:focus-within{
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(calc(var(--search-blur) + 3px)) saturate(165%);
  -webkit-backdrop-filter:blur(calc(var(--search-blur) + 3px)) saturate(165%);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),.13),inset 0 1px rgba(255,255,255,.42)
}
.search svg{width:18px;height:18px}.search input{min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:16px;color:#3a3d40}
.account{
  width:100%;display:flex;gap:10px;align-items:center;padding:9px 7px 11px;
  border-radius:13px;text-align:left;cursor:pointer;transition:background .16s var(--ease),transform .16s var(--ease)
}
.account:hover{background:rgba(255,255,255,.30)}.account:active{transform:scale(.992)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#68afd9,#153d72);color:#fff;font-size:12px;font-weight:800;box-shadow:inset 0 0 0 2px rgba(255,255,255,.42);overflow:hidden;flex:0 0 38px}
.avatar img,.minimized-avatar img,.profile-preview img{width:100%;height:100%;object-fit:cover;display:block}
.avatar i{font-size:20px}
.account strong{display:block;font-size:15px}.account small{display:block;color:#656a70;font-size:13px;margin-top:1px}
.nav{display:grid;gap:1px;padding-bottom:4px}
.nav-gap{height:11px}
.nav-item{
  min-height:var(--nav-h);border-radius:11px;display:flex;align-items:center;gap:8px;padding:3px 7px;
  font-size:15.5px;text-align:left;cursor:pointer;position:relative;overflow:hidden;
  transition:background .16s,transform .16s var(--ease),box-shadow .16s;color:#111;
}
.nav-item:hover{background:rgba(255,255,255,.35)}
.nav-item:active{transform:scale(.988)}
.nav-item.active{background:linear-gradient(#0f75ed,#0864da);color:#fff;box-shadow:0 5px 13px rgba(0,92,211,.15),inset 0 1px rgba(255,255,255,.20)}
.nav-label{
  min-width:0;flex:1;display:block;white-space:nowrap;overflow:hidden;text-overflow:clip;
}
.nav-label.overflowing{
  -webkit-mask-image:linear-gradient(to right,#000 0%,#000 calc(100% - 22px),rgba(0,0,0,.55) calc(100% - 10px),transparent 100%);
  mask-image:linear-gradient(to right,#000 0%,#000 calc(100% - 22px),rgba(0,0,0,.55) calc(100% - 10px),transparent 100%);
}
.nav-ico{
  width:var(--sidebar-icon-size,27px);height:var(--sidebar-icon-size,27px);border-radius:7px;display:grid;place-items:center;flex:0 0 var(--sidebar-icon-size,27px);
  background:linear-gradient(145deg,var(--ic1,#52a9ff),var(--ic2,#0676dd));color:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.34)
}
.nav-item.active .nav-ico{background:rgba(255,255,255,.22);box-shadow:none}
.nav-ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-ico i,.nav-ico span{font-size:18px;line-height:1;display:grid;place-items:center}
.hero-icon i,.hero-icon span{font-size:46px;line-height:1;display:grid;place-items:center}
.row-ico i,.row-ico span{font-size:20px;line-height:1;display:grid;place-items:center}
.window.compact-ui .traffic{gap:8px;height:28px}.window.compact-ui .traffic-dot{width:14px;height:14px}
.window.compact-ui .search{height:34px}.window.compact-ui .nav-item{font-size:14.5px}.window.compact-ui .nav-ico{width:25px;height:25px;flex-basis:25px}.window.compact-ui .nav-ico svg{width:16px;height:16px}

/* ===== Resize divider ===== */
.splitter{position:relative;z-index:30;cursor:col-resize;background:transparent;touch-action:none}
.splitter:after{content:"";position:absolute;inset:0 3px;background:rgba(0,0,0,0);transition:.2s}
.splitter:hover:after,.splitter.active:after{background:rgba(var(--accent-rgb),.28)}


/* Drag the dashboard from the outer glass padding/border too. */
.outer-drag-edge,.ff-outer-drag-edge{
  position:absolute;z-index:71;touch-action:none;background:transparent;cursor:default
}
.outer-drag-edge.top,.ff-outer-drag-edge.top{left:24px;right:24px;top:0;height:9px}
.outer-drag-edge.bottom,.ff-outer-drag-edge.bottom{left:24px;right:24px;bottom:0;height:9px}
.outer-drag-edge.left,.ff-outer-drag-edge.left{left:0;top:24px;bottom:24px;width:9px}
.outer-drag-edge.right,.ff-outer-drag-edge.right{right:0;top:24px;bottom:24px;width:9px}

/* Entire dashboard resize — drag any corner */
.resize-handle{position:absolute;z-index:75;width:22px;height:22px;touch-action:none}
.resize-handle.nw{left:0;top:0;cursor:nwse-resize}.resize-handle.ne{right:0;top:0;cursor:nesw-resize}
.resize-handle.sw{left:0;bottom:0;cursor:nesw-resize}.resize-handle.se{right:0;bottom:0;cursor:nwse-resize}
.resize-handle:after{content:"";position:absolute;width:9px;height:9px;opacity:0;transition:.16s;border-color:rgba(70,76,82,.38)}
.resize-handle:hover:after{opacity:1}
.resize-handle.nw:after{left:5px;top:5px;border-left:1px solid;border-top:1px solid}
.resize-handle.ne:after{right:5px;top:5px;border-right:1px solid;border-top:1px solid}
.resize-handle.sw:after{left:5px;bottom:5px;border-left:1px solid;border-bottom:1px solid}
.resize-handle.se:after{right:5px;bottom:5px;border-right:1px solid;border-bottom:1px solid}

/* ===== Main content ===== */
.main{position:relative;min-width:0;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.73))}
.content{height:100%;overflow:auto;scrollbar-width:none;padding:0 28px 42px;scroll-behavior:smooth;overscroll-behavior:contain}
.toolbar{
  position:sticky;top:0;z-index:20;height:var(--top-bar-height);display:flex;align-items:center;gap:13px;
  background:transparent;margin:0 -28px;padding:0 28px;touch-action:none;cursor:default;
  isolation:isolate;overflow:visible;
}
/* Single fading glass sheet.
   Default mask: TOP 100% -> MIDDLE 50% -> BOTTOM 0%. */
.toolbar:before{
  content:"";position:absolute;z-index:0;pointer-events:none;
  left:-26px;right:-26px;top:-14px;
  height:calc(100% + var(--top-fade-depth) + 14px);
  background:linear-gradient(to bottom,
    rgba(255,255,255,var(--top-glass-opacity)) 0%,
    rgba(250,253,255,.82) 48%,
    rgba(224,243,255,.20) 100%);
  backdrop-filter:blur(var(--top-glass-blur)) saturate(165%);
  -webkit-backdrop-filter:blur(var(--top-glass-blur)) saturate(165%);
  -webkit-mask-image:linear-gradient(to bottom,
    rgba(0,0,0,var(--fade-1)) 0%,
    rgba(0,0,0,var(--fade-1)) 20%,
    rgba(0,0,0,var(--fade-2)) var(--fade-pos-2),
    rgba(0,0,0,var(--fade-3)) 100%);
  mask-image:linear-gradient(to bottom,
    rgba(0,0,0,var(--fade-1)) 0%,
    rgba(0,0,0,var(--fade-1)) 20%,
    rgba(0,0,0,var(--fade-2)) var(--fade-pos-2),
    rgba(0,0,0,var(--fade-3)) 100%);
  transform:translate3d(0,0,0);backface-visibility:hidden;
  will-change:backdrop-filter,-webkit-backdrop-filter,-webkit-mask-image,mask-image;
}
.toolbar:after{display:none!important}
.toolbar>*{position:relative;z-index:1}
.toolbar.drag-handle,.window.dragging .toolbar.drag-handle,.sidebar-top{cursor:default}
.sidebar,.main,.toolbar,.sidebar-top{
  -webkit-transform:translateZ(0);transform:translateZ(0);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
}
.window{
  -webkit-transform-style:flat;transform-style:flat;
}
/* Chromium: keep the masked glass sampling boundary outside the visible area. */
.is-chromium .toolbar:before,.is-chromium .sidebar-top:before{
  left:-32px;right:-32px;
  transform:translate3d(0,0,0);
}
.window.no-edge-blur .toolbar:before,.window.no-edge-blur .sidebar-top:before{display:none}
.window.no-edge-blur .toolbar:after,.window.no-edge-blur .sidebar-top:after{display:none}
.window.no-edge-blur~.finder-window .ff-toolbar:before,.window.no-edge-blur~.finder-window .ff-sidebar-top:before{display:none}
.history{height:45px;border-radius:24px;background:rgba(255,255,255,.90);box-shadow:0 13px 32px rgba(51,64,77,.09);display:flex;overflow:hidden;flex:0 0 auto}
.toolbtn{width:52px;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden}
.toolbtn+.toolbtn{border-left:1px solid var(--line)}
.toolbtn:disabled{opacity:.28}.toolbtn svg{width:25px;height:25px;fill:none;stroke:#3d4044;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.page-title{font-size:20px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar-spacer{flex:1}
.toolbar-actions{display:flex;gap:8px}
.circle-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.80);box-shadow:0 4px 14px rgba(0,0,0,.07);cursor:pointer}
.circle-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mobile-menu{display:none}

/* Tahoe edge blur is now rendered by true masked pseudo-layers above. */
.scroll-blur{display:none!important}

/* ===== Hero and settings cards ===== */
.page{animation:pageIn .28s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.hero{
  min-height:236px;border-radius:22px;background:rgba(246,246,247,.80);
  border:1px solid rgba(255,255,255,.77);display:grid;place-items:center;text-align:center;padding:25px;margin-top:3px;
}
.hero>div{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-icon{width:78px;height:78px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#c8cbd0,#8d9098);box-shadow:0 5px 12px rgba(0,0,0,.14),inset 0 1px 2px rgba(255,255,255,.75);margin:0 auto;flex:0 0 auto}
.hero-icon svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hero h1{font-size:35px;line-height:1;margin:17px 0 10px;letter-spacing:-.035em}
.hero p{max-width:680px;margin:0 auto;font-size:18px;line-height:1.45;color:#73757a}
.group{margin-top:16px;border-radius:18px;background:var(--card);border:1px solid rgba(255,255,255,.81);overflow:hidden}
.group-title{font-size:13px;font-weight:700;color:#777b80;text-transform:uppercase;letter-spacing:.035em;margin:19px 12px 7px}
.row{
  min-height:calc(var(--row-h) * var(--ui));display:flex;align-items:center;gap:13px;padding:9px 14px;position:relative;
  transition:background .15s var(--ease),transform .15s var(--ease);
}
.row.action{cursor:pointer;overflow:hidden}.row.action:hover{background:rgba(255,255,255,.45)}.row.action:active{transform:scale(.997)}
.row+.row:before{content:"";position:absolute;left:61px;right:0;top:0;border-top:1px solid var(--line)}
.row.noicon+.row.noicon:before{left:15px}
.row-ico{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;flex:0 0 33px;color:#fff;background:linear-gradient(145deg,#babdc2,#9699a0);box-shadow:0 1px 4px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.33)}
.row-ico.blue{background:linear-gradient(145deg,#4ab0ff,#0876e5)}.row-ico.teal{background:linear-gradient(145deg,#83d9d1,#45b6ac)}.row-ico.red{background:linear-gradient(145deg,#ff626d,#f02939)}
.row-ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row-main{min-width:0;flex:1}.row-title{font-size:18px;letter-spacing:-.01em}.row-sub{font-size:13px;color:#84868b;margin-top:2px}
.chev{width:18px;height:18px;fill:none;stroke:#afb1b4;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.value{color:#777a7f;font-size:15px;white-space:nowrap}

/* ===== Controls ===== */
.switch{position:relative;width:45px;height:27px;border-radius:999px;background:#b9bcc0;cursor:pointer;transition:.2s;overflow:hidden}
.switch:after{content:"";position:absolute;width:23px;height:23px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22);transition:.22s var(--ease)}
.switch.on{background:var(--accent)}.switch.on:after{transform:translateX(18px)}
.segmented{display:flex;padding:3px;border-radius:12px;background:rgba(80,86,92,.10);gap:2px;max-width:100%;overflow:auto}
.seg{padding:7px 11px;border-radius:9px;font-size:13px;font-weight:650;white-space:nowrap;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.seg.active{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.12)}
.range{
  --fill:50%;
  width:min(290px,43vw);height:8px;border-radius:999px;outline:none;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background:linear-gradient(to right,var(--accent) 0 var(--fill),rgba(105,111,118,.22) var(--fill),rgba(105,111,118,.22) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
.range::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:transparent;border:0}
.range::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;
  margin-top:-5.5px;background:#fff;border:1px solid rgba(0,0,0,.07);
  box-shadow:0 3px 10px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.08);
}
.range::-moz-range-track{height:8px;border-radius:999px;background:rgba(105,111,118,.22);border:0}
.range::-moz-range-progress{height:8px;border-radius:999px;background:var(--accent)}
.range::-moz-range-thumb{
  width:19px;height:19px;border-radius:50%;
  background:#fff;border:1px solid rgba(0,0,0,.07);

/* ===== Integrated Tahoe File Finder — same Tahoe window system ===== */
.finder-launcher{
  position:fixed;left:22px;bottom:max(22px,env(safe-area-inset-bottom));z-index:115;
  width:62px;height:62px;border-radius:50%;display:grid;place-items:center;padding:5px;cursor:pointer;

}

  --ff-sidebar:292px;

  width:min(1120px,calc(100vw - 54px));height:min(840px,calc(100dvh - 46px));min-width:720px;min-height:500px;
  display:none;grid-template-columns:var(--ff-sidebar) 10px minmax(0,1fr);

  background:rgba(255,255,255,.62);box-shadow:var(--shadow);

@keyframes ffOpen{from{opacity:0;scale:.97}to{opacity:1;scale:1}}

  grid-column:1;min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;

  background:transparent;touch-action:none;isolation:isolate;overflow:visible
}

  -webkit-backdrop-filter:blur(var(--top-glass-blur)) saturate(165%);

  mask-image:linear-gradient(to bottom,
    rgba(0,0,0,var(--fade-1)) 0%,
    rgba(0,0,0,var(--fade-1)) 20%,
    rgba(0,0,0,var(--fade-2)) var(--fade-pos-2),
    rgba(0,0,0,var(--fade-3)) 100%);
  transform:translate3d(0,0,0);backface-visibility:hidden
}

  width:100%;min-height:var(--nav-h);border-radius:11px;display:flex;align-items:center;gap:8px;padding:3px 7px;

.ff-main{grid-column:3;position:relative;min-width:0;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.73))}
.ff-content{height:100%;overflow:auto;scrollbar-width:none;padding:0 28px 42px;scroll-behavior:smooth;overscroll-behavior:contain;position:relative}
.ff-toolbar{
  position:sticky;top:0;z-index:20;height:var(--top-bar-height);display:flex;align-items:center;gap:13px;

.ff-toolbar:before{

  -webkit-mask-image:linear-gradient(to bottom,
    rgba(0,0,0,var(--fade-1)) 0%,
    rgba(0,0,0,var(--fade-1)) 20%,
    rgba(0,0,0,var(--fade-2)) var(--fade-pos-2),
    rgba(0,0,0,var(--fade-3)) 100%);
  mask-image:linear-gradient(to bottom,
    rgba(0,0,0,var(--fade-1)) 0%,

    rgba(0,0,0,var(--fade-2)) var(--fade-pos-2),
    rgba(0,0,0,var(--fade-3)) 100%)
}
.ff-toolbar>*{position:relative;z-index:1}
.ff-title{font-size:20px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ff-view{display:flex;padding:3px;border-radius:13px;background:rgba(0,0,0,.065)}
.ff-view button{width:35px;height:31px;border-radius:9px;background:transparent;cursor:pointer;font-size:17px}
.ff-view button.active{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.10)}

.ff-breadcrumb{height:38px;display:flex;align-items:center;gap:4px;padding:0 4px;position:relative;z-index:4}
.ff-crumb{height:28px;border-radius:8px;padding:0 8px;background:transparent;cursor:pointer;font-size:12px;color:#686d73}
.ff-crumb:hover{background:rgba(0,0,0,.05)}.ff-crumb-sep{color:#b0b4b8;font-size:12px}
.ff-drop{position:absolute;inset:calc(var(--top-bar-height) + 6px) 8px 32px;border:2px dashed var(--accent);border-radius:18px;background:rgba(var(--accent-rgb),.08);z-index:50;display:none;place-items:center;color:var(--accent);font-weight:760;pointer-events:none;text-align:center}.ff-content.dragover .ff-drop{display:grid}

.ff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:13px;padding:8px 4px 12px}
.ff-card{min-height:118px;border-radius:14px;padding:9px 8px;cursor:pointer;text-align:center;position:relative;overflow:hidden;border:1px solid transparent;user-select:none}
.ff-card:hover{background:rgba(0,0,0,.035)}.ff-card.selected{background:rgba(var(--accent-rgb),.11);border-color:rgba(var(--accent-rgb),.28)}
.ff-icon{height:70px;display:grid;place-items:center}.ff-icon i{font-size:56px;color:#4ea9ec;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08))}
.ff-icon img{max-width:92px;max-height:68px;border-radius:7px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ff-name{font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:4px}.ff-meta{font-size:10px;color:#979ba0;margin-top:2px}
.ff-list{padding:4px}.ff-list-head,.ff-list-row{display:grid;grid-template-columns:minmax(230px,1fr) 105px 95px 120px;align-items:center;gap:10px}
.ff-list-head{height:32px;padding:0 10px;color:#858a90;font-size:11px;border-bottom:1px solid var(--line)}
.ff-list-row{min-height:43px;border-bottom:1px solid rgba(0,0,0,.055);padding:4px 10px;font-size:12px;cursor:pointer;border-radius:7px}
.ff-list-row:hover{background:rgba(0,0,0,.035)}.ff-list-row.selected{background:rgba(var(--accent-rgb),.12)}
.ff-list-name{display:flex;align-items:center;gap:8px;min-width:0}.ff-list-name i{font-size:22px;color:#4aa9ea}.ff-list-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ff-inspector{
  position:absolute;right:10px;top:calc(var(--top-bar-height) + 10px);bottom:10px;width:285px;z-index:42;overflow:auto;padding:15px 14px 24px;
  border-radius:max(18px,calc(var(--window-radius) - 9px));background:rgba(248,250,252,.88);
  border:1px solid rgba(255,255,255,.72);box-shadow:0 20px 60px rgba(0,0,0,.20);
  backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
  transform:translateX(calc(100% + 30px));transition:.25s var(--ease);scrollbar-width:none
}
.finder-window.inspect .ff-inspector{transform:none}
.ff-preview{min-height:180px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.56);border:1px solid rgba(0,0,0,.055);overflow:hidden;margin-bottom:12px}
.ff-preview i{font-size:76px;color:#55aee9}.ff-preview img,.ff-preview video{max-width:100%;max-height:250px}.ff-preview audio{width:90%}
.ff-inspect-title{font-size:17px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ff-inspect-sub{font-size:12px;color:#868a90;margin-top:3px}
.ff-info{margin-top:13px;border-radius:14px;background:rgba(255,255,255,.58);overflow:hidden;border:1px solid rgba(0,0,0,.05)}
.ff-info-row{min-height:39px;padding:8px 10px;display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;font-size:11px}
.ff-info-row+.ff-info-row{border-top:1px solid rgba(0,0,0,.055)}.ff-info-row b{color:#878b90}.ff-info-row span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ff-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.ff-btn{height:34px;border-radius:10px;background:rgba(0,0,0,.065);padding:0 11px;cursor:pointer;font-size:12px;font-weight:650;position:relative;overflow:hidden}.ff-btn.primary{background:var(--accent);color:#fff}.ff-btn.danger{background:rgba(255,59,48,.10);color:#c7261f}
.ff-status{position:absolute;left:calc(var(--ff-sidebar) + 10px);right:0;bottom:0;height:26px;z-index:10;display:flex;align-items:center;justify-content:center;font-size:10px;color:#8b8f94;background:rgba(248,250,252,.87);border-top:1px solid rgba(0,0,0,.055);backdrop-filter:blur(10px)}
.ff-empty{display:grid;place-items:center;text-align:center;min-height:330px;color:#94999f}.ff-empty i{font-size:54px;color:#b7bcc1}.ff-empty b{display:block;margin-top:8px;color:#676c72}
.ff-progress{height:8px;border-radius:999px;background:rgba(0,0,0,.09);overflow:hidden}.ff-progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .15s}
.ff-tagbar{display:flex;gap:6px;flex-wrap:wrap}.ff-tag{width:15px;height:15px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.09)}.ff-tag.active{outline:2px solid rgba(0,0,0,.22);outline-offset:2px}
.ff-resize{position:absolute;z-index:75;width:22px;height:22px;touch-action:none}.ff-resize.nw{left:0;top:0;cursor:nwse-resize}.ff-resize.ne{right:0;top:0;cursor:nesw-resize}.ff-resize.sw{left:0;bottom:0;cursor:nesw-resize}.ff-resize.se{right:0;bottom:0;cursor:nwse-resize}
.finder-window.compact-ui .traffic{gap:8px;height:28px}.finder-window.compact-ui .traffic-dot{width:14px;height:14px}.finder-window.compact-ui .search{height:34px}.finder-window.compact-ui .ff-side-item{font-size:14.5px}
.is-chromium .ff-toolbar:before,.is-chromium .ff-sidebar-top:before{left:-32px;right:-32px}

@media(max-width:1040px){
  .finder-window{--ff-sidebar:255px;min-width:650px}.ff-inspector{width:275px}.ff-status{left:calc(var(--ff-sidebar) + 10px)}
}
@media(max-width:760px){
  .finder-launcher{left:14px;bottom:max(14px,env(safe-area-inset-bottom))}
  .finder-window{left:0;top:0;transform:none!important;width:100vw!important;height:100dvh!important;min-width:0;min-height:0;border-radius:0;grid-template-columns:1fr}
  .ff-sidebar{position:absolute;z-index:55;left:10px;top:max(10px,env(safe-area-inset-top));bottom:max(10px,env(safe-area-inset-bottom));width:min(88vw,355px);margin:0;border-radius:28px;border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 80px rgba(0,0,0,.25);transform:translateX(calc(-100% - 30px));transition:transform .30s var(--ease);padding:0 10px 14px}
  .finder-window.sideopen .ff-sidebar{transform:none}.ff-splitter,.ff-resize{display:none}.ff-main{grid-column:1}.ff-content{padding:0 12px 42px}.ff-toolbar{margin:0 -12px;padding:0 12px}.ff-status{left:0}.ff-list-head,.ff-list-row{grid-template-columns:minmax(170px,1fr) 88px}.ff-list-head>*:nth-child(n+3),.ff-list-row>*:nth-child(n+3){display:none}
}

/* ===== Modal ===== */
.modal-backdrop{position:fixed;inset:0;z-index:80;background:rgba(13,21,28,.22);display:grid;place-items:center;padding:18px;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.22s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{width:min(560px,100%);max-height:min(720px,88dvh);overflow:auto;border-radius:25px;background:rgba(249,250,251,.94);box-shadow:0 30px 80px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.85);padding:18px;transform:scale(.97) translateY(8px);transition:.22s var(--ease)}
.modal-backdrop.open .modal{transform:none}.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:13px}.modal-head h2{font-size:20px;margin:0;flex:1}.modal-close{width:31px;height:31px;border-radius:50%;background:rgba(0,0,0,.07);cursor:pointer}
.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:#74777b;font-weight:650}.field input{width:100%;border:1px solid rgba(0,0,0,.10);border-radius:11px;padding:10px 11px;outline:none;background:#fff}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12)}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.btn{border-radius:11px;padding:9px 13px;background:rgba(0,0,0,.07);cursor:pointer;font-weight:650;position:relative;overflow:hidden}.btn.primary{background:var(--accent);color:#fff}

/* ===== Ripple / toast ===== */
.ripple{
  position:absolute;border-radius:50%;transform:scale(0);pointer-events:none;
  background:var(--ripple-color,rgba(23,112,232,.15));
  opacity:.95;animation:rip .56s cubic-bezier(.2,.75,.2,1);
  will-change:transform,opacity;
}
.nav-item.active,.btn.primary,.switch.on{--ripple-color:rgba(255,255,255,.42)}
.toolbtn,.circle-btn,.modal-close{--ripple-color:rgba(30,90,150,.12)}
@keyframes rip{to{transform:scale(3.9);opacity:0}}
.toast{position:fixed;z-index:120;left:50%;bottom:max(24px,env(safe-area-inset-bottom));translate:-50% 18px;opacity:0;pointer-events:none;transition:.24s var(--ease);background:rgba(27,29,32,.84);color:#fff;border-radius:13px;padding:10px 14px;font-size:13px;backdrop-filter:blur(16px)}
.toast.show{opacity:1;translate:-50% 0}

/* ===== Responsive iPhone/iPad ===== */
@media(max-width:860px){
  body{overflow:hidden}
  .window,.window[data-size]{left:0!important;top:0!important;transform:none!important;width:100%!important;height:100dvh!important;border:0;border-radius:0;display:block;background:rgba(255,255,255,.72)}
  .sidebar{position:fixed;z-index:55;left:10px;top:max(10px,env(safe-area-inset-top));bottom:max(10px,env(safe-area-inset-bottom));width:min(88vw,355px);margin:0;border-radius:28px;border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 80px rgba(0,0,0,.25);transform:translateX(calc(-100% - 30px));transition:transform .30s var(--ease);padding:0 10px 14px}
  .window.drawer .sidebar{transform:none}.splitter,.resize-handle{display:none}
  .main{height:100dvh}.content{padding:0 12px calc(env(safe-area-inset-bottom) + 26px)}
  .toolbar{height:calc(max(48px,var(--top-bar-height)) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;margin:0 -12px;cursor:default!important}
  .scroll-blur{top:calc(48px + env(safe-area-inset-top));margin:0 -12px -38px}
  .mobile-menu{display:grid}.toolbar-actions .circle-btn:first-child{display:none}.history{height:42px}.toolbtn{width:47px}
  .hero{min-height:215px;border-radius:24px;padding:22px 15px}.hero-icon{width:68px;height:68px;border-radius:18px}.hero-icon svg{width:45px;height:45px}.hero h1{font-size:30px}.hero p{font-size:15.5px}
  .row-title{font-size:16px}.row-sub{font-size:12px}.row{padding:8px 11px}.group{border-radius:19px}.row+.row:before{left:56px}
  .preview-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}.range{width:42vw}
  .drawer-backdrop{display:block}
}
.drawer-backdrop{position:fixed;inset:0;z-index:50;background:rgba(12,23,33,.18);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.28s}
.window.drawer .drawer-backdrop{opacity:1;pointer-events:auto}
@media(min-width:861px){.drawer-backdrop{display:none}}
@media(max-width:430px){
  .page-title{font-size:17px}.toolbar{gap:8px}.history{flex:0 0 auto}.hero{min-height:200px}.hero p{max-width:315px}.preview{min-height:98px}.value{font-size:13px}
  .customize-btn{width:38px;padding:0;justify-content:center}.customize-btn span{display:none}
  .minimized-launcher{right:14px;bottom:max(14px,env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="wallpaper-layer" id="wallpaperLayer"></div>

<script>
/* Tahoe Admin Dashboard Pro
   Single-file shell. No framework. No dependency.
   Integration hooks:
     TahoeAdmin.on("action", e => ...)
     TahoeAdmin.on("page", e => ...)
     TahoeAdmin.on("setting", e => ...)
     TahoeAdmin.config()
*/
const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)];

const FF_STORE="tahoeAdminFinder.v1";
const ff=Object.assign({
  items:[],trash:[],current:"documents",selected:null,view:"grid",special:null,tag:null,query:"",
  history:["documents"],historyIndex:0,window:null,zoomed:false,sidebar:292
},JSON.parse(localStorage.getItem(FF_STORE)||"{}"));
const FF_ROOTS=[
 {id:"root",name:"File Library",parent:null,type:"folder",system:true},
 {id:"desktop",name:"Desktop",parent:"root",type:"folder",system:true},
 {id:"documents",name:"Documents",parent:"root",type:"folder",system:true},
 {id:"downloads",name:"Downloads",parent:"root",type:"folder",system:true}
];
let ffSyncTimer=null,ffRenameTarget=null,ffDragState=null,ffResizeState=null,ffZ=150;
function ffUid(){return "f_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function ffSave(sync=true){localStorage.setItem(FF_STORE,JSON.stringify(ff));if(sync&&backend.firebase?.databaseURL&&state.settings.autoFileSync)ffQueueSync()}
function ffAll(){return [...FF_ROOTS,...ff.items]}
function ffById(id){return ffAll().find(x=>x.id===id)}
function ffChildren(id){return ff.items.filter(x=>x.parent===id&&!ff.trash.includes(x.id))}
function ffDescendants(id){const a=[];const walk=p=>ff.items.filter(x=>x.parent===p).forEach(x=>{a.push(x.id);if(x.type==="folder")walk(x.id)});walk(id);return a}
function ffPath(id){const a=[];let x=ffById(id),g=0;while(x&&g++<30){a.unshift(x);x=x.parent?ffById(x.parent):null}return a}
function ffFmtSize(n=0){if(!n)return "—";const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n<10&&i?n.toFixed(1):Math.round(n)} ${u[i]}`}
function ffFmtDate(t){return t?new Date(t).toLocaleString([], {dateStyle:"medium",timeStyle:"short"}):"—"}
function ffExt(n=""){const i=n.lastIndexOf(".");return i>0?n.slice(i+1).toLowerCase():""}
function ffIcon(x){
 if(x?.type==="folder")return "ri-folder-3-fill";const m=x?.mime||"",e=ffExt(x?.name||"");
 if(m.startsWith("image/"))return "ri-image-2-line";if(m.startsWith("video/"))return "ri-video-line";if(m.startsWith("audio/"))return "ri-music-2-line";
 if(m.includes("pdf"))return "ri-file-pdf-2-line";if(m.includes("zip")||["zip","rar","7z","gz"].includes(e))return "ri-file-zip-line";
 if(["html","css","js","json","py","php","java","kt","swift","dart"].includes(e))return "ri-code-s-slash-line";return "ri-file-3-line"
}
function ffSeed(){
 if(ff.items.length)return;
 const t=Date.now();ff.items=[
  {id:ffUid(),parent:"documents",type:"folder",name:"Website Projects",created:t-864e5*5,updated:t-864e5,tags:["blue"],provider:"metadata"},
  {id:ffUid(),parent:"documents",type:"folder",name:"Design Assets",created:t-864e5*9,updated:t-864e5*2,tags:["orange"],provider:"metadata"},
  {id:ffUid(),parent:"documents",type:"folder",name:"Backups",created:t-864e5*12,updated:t-864e5*3,tags:[],provider:"metadata"}
 ];ffSave(false)
}
function ffCurrentItems(){
 let list;if(ff.special==="recents")list=ff.items.filter(x=>!ff.trash.includes(x.id)).sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,50);
 else if(ff.special==="cloudinary")list=ff.items.filter(x=>x.provider==="cloudinary"&&!ff.trash.includes(x.id));
 else if(ff.special==="firebase")list=ff.items.filter(x=>!ff.trash.includes(x.id));
 else if(ff.tag)list=ff.items.filter(x=>x.tags?.includes(ff.tag)&&!ff.trash.includes(x.id));
 else list=ffChildren(ff.current);
 const q=ff.query.trim().toLowerCase();if(q)list=list.filter(x=>x.name.toLowerCase().includes(q));
 return list.sort((a,b)=>Number(b.type==="folder")-Number(a.type==="folder")||a.name.localeCompare(b.name))
}
async function ffDB(){return await new Promise((res,rej)=>{const r=indexedDB.open("TahoeAdminFinderBlobs",1);r.onupgradeneeded=()=>r.result.createObjectStore("blobs");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function ffPutBlob(id,b){const d=await ffDB();return await new Promise((res,rej)=>{const t=d.transaction("blobs","readwrite");t.objectStore("blobs").put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function ffGetBlob(id){const d=await ffDB();return await new Promise((res,rej)=>{const r=d.transaction("blobs").objectStore("blobs").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function ffNavigate(id,history=true){
 const x=ffById(id);if(!x||x.type!=="folder")return;ff.current=id;ff.special=null;ff.tag=null;ff.selected=null;
 if(history){ff.history=ff.history.slice(0,ff.historyIndex+1);ff.history.push(id);ff.historyIndex=ff.history.length-1}ffSave(false);ffRender()
}
function ffOpenItem(id){const x=ffById(id);if(!x)return;if(x.type==="folder")return ffNavigate(id);ff.selected=id;ffRender();if(x.url)window.open(x.url,"_blank")}
function ffNewFolder(name){
 name=(name||"New Folder").trim()||"New Folder";const names=ffChildren(ff.current).map(x=>x.name.toLowerCase());let final=name,n=2;while(names.includes(final.toLowerCase()))final=`${name} ${n++}`;
 ff.items.push({id:ffUid(),parent:ff.current,type:"folder",name:final,created:Date.now(),updated:Date.now(),tags:[],provider:"metadata"});ffSave();ffRender();showToast("Folder created")
}
function ffRename(id,name){const x=ff.items.find(x=>x.id===id);if(!x||!name.trim())return;x.name=name.trim();x.updated=Date.now();ffSave();ffRender();showToast("Renamed")}
function ffTrash(id){const x=ffById(id);if(!x||x.system)return;ff.trash=[...new Set([...ff.trash,id,...ffDescendants(id)])];if(ff.selected===id)ff.selected=null;ffSave();ffRender();showToast("Moved to Trash")}
function ffMove(id,parent){const x=ff.items.find(x=>x.id===id);if(!x||id===parent||ffDescendants(id).includes(parent))return;x.parent=parent;x.updated=Date.now();ffSave();ffRender();showToast(`Moved to ${ffById(parent)?.name||"folder"}`)}
function ffTag(id,tag){const x=ff.items.find(x=>x.id===id);if(!x)return;x.tags=x.tags||[];x.tags=x.tags.includes(tag)?x.tags.filter(t=>t!==tag):[...x.tags,tag];x.updated=Date.now();ffSave();ffRenderInspector()}
function ffCloudinaryConfig(){return backend.cloudinary||{}}
async function ffCloudinaryUpload(file,onProgress){
 const c=ffCloudinaryConfig();if(!c.cloudName||!c.uploadPreset)throw new Error("Set Cloudinary Cloud Name and Upload Preset in Backend Configuration.");
 return await new Promise((res,rej)=>{
  const xhr=new XMLHttpRequest();xhr.open("POST",`https://api.cloudinary.com/v1_1/${encodeURIComponent(c.cloudName)}/auto/upload`);
  xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress?.(Math.round(e.loaded/e.total*100))};
  xhr.onload=()=>{try{const j=JSON.parse(xhr.responseText);if(xhr.status>=200&&xhr.status<300&&j.secure_url)res(j);else rej(new Error(j.error?.message||"Cloudinary upload failed"))}catch{rej(new Error("Cloudinary upload failed"))}};
  xhr.onerror=()=>rej(new Error("Cloudinary network error"));const fd=new FormData();fd.append("file",file);fd.append("upload_preset",c.uploadPreset);xhr.send(fd)
 })
}
async function ffUploadFiles(files){
 files=[...files];if(!files.length)return;const modal=$("#finderUploadModal"),label=$("#finderUploadLabel"),bar=$("#finderUploadProgress");modal.classList.add("open");
 try{
  for(let i=0;i<files.length;i++){
   const file=files[i];label.textContent=`${i+1}/${files.length} · ${file.name}`;bar.style.width=`${i/files.length*100}%`;
   const rec={id:ffUid(),parent:ff.current,type:"file",name:file.name,size:file.size,mime:file.type||"application/octet-stream",created:Date.now(),updated:Date.now(),tags:[],provider:"local",url:""};
   if(ffCloudinaryConfig().cloudName&&ffCloudinaryConfig().uploadPreset){
    const r=await ffCloudinaryUpload(file,p=>bar.style.width=`${(i/files.length*100)+(p/files.length)}%`);Object.assign(rec,{provider:"cloudinary",url:r.secure_url,publicId:r.public_id,resourceType:r.resource_type})
   }else{await ffPutBlob(rec.id,file);bar.style.width=`${(i+1)/files.length*100}%`}
   ff.items.push(rec);ffSave()
  }showToast(`${files.length} file${files.length>1?"s":""} added`)
 }catch(e){showToast(e.message||"Upload failed")}finally{modal.classList.remove("open");bar.style.width="0";ffRender()}
}
async function ffDownload(x){
 if(!x)return;if(x.url){const a=document.createElement("a");a.href=x.url;a.target="_blank";a.download=x.name;a.click();return}
 if(x.provider==="local"){const b=await ffGetBlob(x.id);if(!b)return showToast("Local file data not found");const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
}
function ffFirebaseURL(){
 const db=(backend.firebase?.databaseURL||"").replace(/\/+$/,""),path=(backend.firebase?.filePath||"adminDashboard/files").replace(/^\/+|\/+$/g,"");
 if(!db)return "";const auth=firebaseRuntime.idToken?`?auth=${encodeURIComponent(firebaseRuntime.idToken)}`:"";return `${db}/${path}.json${auth}`
}
async function ffPush(){
 const payload={version:1,updatedAt:Date.now(),items:ff.items,trash:ff.trash};
 if(window.TahoeFirebase?.writeFiles)return await window.TahoeFirebase.writeFiles(payload);
 const u=ffFirebaseURL();if(!u)throw new Error("Set Firebase Database URL first.");
 const r=await fetch(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!r.ok)throw new Error(`Firebase ${r.status}`);return r.json()
}
async function ffPull(){
 let d;
 if(window.TahoeFirebase?.readFiles)d=await window.TahoeFirebase.readFiles();
 else{const u=ffFirebaseURL();if(!u)throw new Error("Set Firebase Database URL first.");const r=await fetch(u);if(!r.ok)throw new Error(`Firebase ${r.status}`);d=await r.json()}
 if(d?.items){ff.items=d.items;ff.trash=d.trash||[];ffSave(false);ffRender()}return d
}
function ffQueueSync(){clearTimeout(ffSyncTimer);ffSyncTimer=setTimeout(()=>ffPush().catch(e=>showToast(e.message)),900)}
async function ffSyncNow(){try{$("#finderSyncBtn i").className="ri-loader-4-line";await ffPull();await ffPush();showToast("File metadata synced")}catch(e){showToast(e.message||"Sync failed")}finally{$("#finderSyncBtn i").className="ri-refresh-line"}}
function ffRender(){
 ffRenderSidebar();ffRenderBreadcrumb();ffRenderFiles();ffRenderInspector();ffRenderStatus();ffUpdateNav();ffUpdateSync()
}
function ffRenderSidebar(){
 $$(".ff-side-item",$("#finderSidebar")).forEach(b=>b.classList.remove("active"));
 if(ff.special)$(`[data-ff-special="${ff.special}"]`)?.classList.add("active");else if(ff.tag)$(`[data-ff-tag="${ff.tag}"]`)?.classList.add("active");else $(`[data-ff-root="${ff.current}"]`)?.classList.add("active");
 $("#finderFolderTitle").textContent=ff.special?({recents:"Recents",cloudinary:"Cloudinary",firebase:"Firebase Metadata"}[ff.special]||"Files"):ff.tag?`${ff.tag} Tag`:(ffById(ff.current)?.name||"Files")
}
function ffRenderBreadcrumb(){
 if(ff.special||ff.tag){$("#finderBreadcrumb").innerHTML=`<button class="ff-crumb">${esc($("#finderFolderTitle").textContent)}</button>`;return}
 $("#finderBreadcrumb").innerHTML=ffPath(ff.current).map((x,i,a)=>`<button class="ff-crumb" data-ff-crumb="${x.id}">${esc(x.name)}</button>${i<a.length-1?'<span class="ff-crumb-sep">›</span>':""}`).join("")
}
function ffCard(x){
 const thumb=x.mime?.startsWith("image/")&&x.url?`<img src="${esc(x.url)}" alt="">`:`<i class="${ffIcon(x)}"></i>`;
 return `<div class="ff-card ${ff.selected===x.id?"selected":""}" data-ff-id="${x.id}" draggable="true"><div class="ff-icon">${thumb}</div><div class="ff-name">${esc(x.name)}</div><div class="ff-meta">${x.type==="folder"?"Folder":ffFmtSize(x.size)}</div></div>`
}
function ffListRow(x){
 return `<div class="ff-list-row ${ff.selected===x.id?"selected":""}" data-ff-id="${x.id}" draggable="true"><div class="ff-list-name"><i class="${ffIcon(x)}"></i><span>${esc(x.name)}</span></div><div>${x.type==="folder"?"Folder":esc(x.mime||ffExt(x.name).toUpperCase()||"File")}</div><div>${ffFmtSize(x.size)}</div><div>${ffFmtDate(x.updated)}</div></div>`
}
function ffRenderFiles(){
 const items=ffCurrentItems();$$("[data-ff-view]",$("#finderViewSeg")).forEach(b=>b.classList.toggle("active",b.dataset.ffView===ff.view));
 if(!items.length){$("#finderArea").innerHTML=`<div class="ff-empty"><div><i class="ri-folder-open-line"></i><b>No files here</b><span>Create a folder or upload files.</span></div></div>`;return}
 $("#finderArea").innerHTML=ff.view==="grid"?`<div class="ff-grid">${items.map(ffCard).join("")}</div>`:`<div class="ff-list"><div class="ff-list-head"><div>Name</div><div>Kind</div><div>Size</div><div>Date Modified</div></div>${items.map(ffListRow).join("")}</div>`;
 $$("[data-ff-id]",$("#finderArea")).forEach(el=>{
  const id=el.dataset.ffId;el.onclick=e=>{e.stopPropagation();ff.selected=id;ffRenderFiles();ffRenderInspector();ffRenderStatus()};el.ondblclick=e=>{e.stopPropagation();ffOpenItem(id)};
  el.ondragstart=e=>{e.dataTransfer.setData("text/x-tahoe-file",id);e.dataTransfer.effectAllowed="move"};
  if(ffById(id)?.type==="folder"){el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const moving=e.dataTransfer.getData("text/x-tahoe-file");if(moving)ffMove(moving,id)}}
 })
}
async function ffRenderInspector(){
 const x=ffById(ff.selected)||ffById(ff.current),p=$("#finderPreview");$("#finderInspectTitle").textContent=x?.name||"Files";$("#finderInspectSub").textContent=x?.type==="folder"?"Folder":(x?.mime||"File");
 if(x?.type==="folder")p.innerHTML='<i class="ri-folder-3-fill"></i>';
 else if(x?.mime?.startsWith("image/")&&x.url)p.innerHTML=`<img src="${esc(x.url)}" alt="">`;
 else if(x?.mime?.startsWith("video/")&&x.url)p.innerHTML=`<video src="${esc(x.url)}" controls></video>`;
 else if(x?.mime?.startsWith("audio/")&&x.url)p.innerHTML=`<audio src="${esc(x.url)}" controls></audio>`;
 else p.innerHTML=`<i class="${ffIcon(x||{})}"></i>`;
 const colors={red:"#ff3b30",orange:"#ff9500",green:"#34c759",blue:"#0a84ff"};
 $("#finderInfo").innerHTML=`<div class="ff-info-row"><b>Kind</b><span>${x?.type==="folder"?"Folder":esc(x?.mime||"File")}</span></div><div class="ff-info-row"><b>Size</b><span>${x?.type==="folder"?`${ffDescendants(x.id).length} items`:ffFmtSize(x?.size)}</span></div><div class="ff-info-row"><b>Modified</b><span>${ffFmtDate(x?.updated)}</span></div><div class="ff-info-row"><b>Provider</b><span>${esc(x?.provider||"Metadata")}</span></div><div class="ff-info-row"><b>Tags</b><span class="ff-tagbar">${Object.entries(colors).map(([t,c])=>`<button class="ff-tag ${x?.tags?.includes(t)?"active":""}" data-ff-tag-toggle="${t}" style="background:${c}"></button>`).join("")}</span></div>`;
 $("#finderActions").innerHTML=x&&!x.system?`${x.type==="folder"?'<button class="ff-btn primary" data-ff-action="open">Open</button>':'<button class="ff-btn primary" data-ff-action="download">Download</button>'}<button class="ff-btn" data-ff-action="rename">Rename</button>${x.url?'<button class="ff-btn" data-ff-action="copy">Copy Link</button>':""}<button class="ff-btn danger" data-ff-action="trash">Trash</button>`:"";
 $$("[data-ff-tag-toggle]",$("#finderInfo")).forEach(b=>b.onclick=()=>ffTag(x.id,b.dataset.ffTagToggle));
 $$("[data-ff-action]",$("#finderActions")).forEach(b=>b.onclick=async()=>{const a=b.dataset.ffAction;if(a==="open")ffOpenItem(x.id);if(a==="download")ffDownload(x);if(a==="rename"){ffRenameTarget=x.id;$("#finderRenameName").value=x.name;$("#finderRenameModal").classList.add("open");setTimeout(()=>$("#finderRenameName").select(),40)}if(a==="copy"){try{await navigator.clipboard.writeText(x.url);showToast("Link copied")}catch{showToast("Copy failed")}}if(a==="trash")ffTrash(x.id)})
}
function ffRenderStatus(){const a=ffCurrentItems(),x=ffById(ff.selected);$("#finderStatus").textContent=x?`${a.length} items · ${x.name}`:`${a.length} items`}
function ffUpdateNav(){$("#finderBackBtn").disabled=ff.historyIndex<=0;$("#finderForwardBtn").disabled=ff.historyIndex>=ff.history.length-1}
function ffUpdateSync(){
 const ok=!!(backend.firebase?.databaseURL);const e=$("#finderSyncStatus");e.classList.toggle("on",ok);e.innerHTML=ok?'<i class="ri-cloud-line"></i><span>Firebase metadata ready</span>':'<i class="ri-cloud-off-line"></i><span>Local metadata mode</span>'
}
function syncFinderTahoeStyle(){
 const fw=$("#finderWindow");if(!fw)return;

async function firebaseGlobalRequest(method,data){
 const url=firebasePathURL();if(!url)throw new Error("Set Firebase Database URL first.");
 const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:data===undefined?undefined:JSON.stringify(data)});
 if(!r.ok){let msg=`Firebase ${r.status}`;try{const j=await r.json();msg=j.error||msg}catch{}throw new Error(msg)}
 return await r.json();
}
async function publishGlobalConfig(){
 if(firebaseRuntime.syncing)return;firebaseRuntime.syncing=true;
 try{
   if(window.TahoeFirebase?.writeGlobal)await window.TahoeFirebase.writeGlobal(globalConfigPayload());
   else await firebaseGlobalRequest("PUT",globalConfigPayload());
   firebaseRuntime.lastSync=Date.now();showToast("Global design published to Firebase");emit("firebase",{action:"publish",ok:true})
 }catch(e){showToast(e.message||"Firebase publish failed");emit("firebase",{action:"publish",ok:false,error:e.message})}
 finally{firebaseRuntime.syncing=false}
}
async function pullGlobalConfig(){
 if(firebaseRuntime.syncing)return;firebaseRuntime.syncing=true;
 try{
   const g=window.TahoeFirebase?.readGlobal?await window.TahoeFirebase.readGlobal():await firebaseGlobalRequest("GET");
   if(g)mergeGlobalConfig(g);firebaseRuntime.lastSync=Date.now();showToast(g?"Global design loaded":"No global design found");emit("firebase",{action:"pull",ok:true})
 }catch(e){showToast(e.message||"Firebase pull failed");emit("firebase",{action:"pull",ok:false,error:e.message})}
 finally{firebaseRuntime.syncing=false}
}
function queueGlobalSync(){
 clearTimeout(firebaseRuntime.syncTimer);firebaseRuntime.syncTimer=setTimeout(()=>publishGlobalConfig(),900)
}

async function localImageToDataURL(file){
 if(!file||!file.type.startsWith("image/"))throw new Error("Please choose an image file.");
 const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=raw});
 const max=2400,scale=Math.min(1,max/Math.max(img.width,img.height));
 const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
 c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 return c.toDataURL("image/webp",.88);
}
async function uploadCloudinary(file,onProgress){
 const cfg=backend.cloudinary||{};
 if(!cfg.cloudName||!cfg.uploadPreset)throw new Error("Set Cloudinary Cloud Name and Upload Preset first.");
 if(!file||!file.type.startsWith("image/"))throw new Error("Please choose an image file.");
 return await new Promise((resolve,reject)=>{
   const xhr=new XMLHttpRequest();
   xhr.open("POST",`https://api.cloudinary.com/v1_1/${encodeURIComponent(cfg.cloudName)}/image/upload`);
   xhr.upload.onprogress=e=>{if(e.lengthComputable&&onProgress)onProgress(Math.round(e.loaded/e.total*100))};
   xhr.onload=()=>{try{const j=JSON.parse(xhr.responseText);if(xhr.status>=200&&xhr.status<300&&j.secure_url)resolve(j.secure_url);else reject(new Error(j.error?.message||"Cloudinary upload failed."))}catch{reject(new Error("Cloudinary upload failed."))}};
   xhr.onerror=()=>reject(new Error("Cloudinary network error."));
   const fd=new FormData();fd.append("file",file);fd.append("upload_preset",cfg.uploadPreset);xhr.send(fd);
 });
}

/* ===== Smooth real mouse window dragging — toolbar + sidebar glass head ===== */
let drag=null,raf=0,pending=null;
const dragSurfaces=[toolbar,$("#sidebarTop"),...$$("[data-window-drag-edge]",win)];
function pixelizeWindow(){
 const r=win.getBoundingClientRect();
 win.style.left=r.left+"px";win.style.top=r.top+"px";win.style.width=r.width+"px";win.style.height=r.height+"px";win.style.transform="none";
 return r;
}
function startWindowDrag(e,surface){
 if(innerWidth<=860||e.target.closest("[data-no-drag],button,input,select,.resize-handle"))return;
 const r=pixelizeWindow();
 win.classList.add("dragging","no-anim");
 drag={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top,surface};
 surface.setPointerCapture(e.pointerId);
}
function moveWindowDrag(e){
 if(!drag||e.pointerId!==drag.id)return;
 pending={x:e.clientX-drag.dx,y:e.clientY-drag.dy};
 if(!raf)raf=requestAnimationFrame(()=>{
   raf=0;if(!pending)return;const r=win.getBoundingClientRect();
   const x=Math.min(Math.max(0,innerWidth-r.width),Math.max(0,pending.x));
   const y=Math.min(Math.max(0,innerHeight-r.height),Math.max(0,pending.y));
   win.style.left=x+"px";win.style.top=y+"px";pending=null;
 });
}
function endDrag(e){
 if(!drag||e.pointerId!==drag.id)return;
 drag=null;win.classList.remove("dragging");setTimeout(()=>win.classList.remove("no-anim"),20);
 const r=win.getBoundingClientRect();state.pos={left:Math.round(r.left),top:Math.round(r.top)};save()
}
dragSurfaces.forEach(surface=>{
 surface.addEventListener("pointerdown",e=>startWindowDrag(e,surface));
 surface.addEventListener("pointermove",moveWindowDrag);
 surface.addEventListener("pointerup",endDrag);
 surface.addEventListener("pointercancel",endDrag);
});

/* ===== Resize the whole dashboard from any corner ===== */
let cornerResize=null,cornerRAF=0,cornerPending=null;
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
$$("[data-resize]").forEach(handle=>{
 handle.addEventListener("pointerdown",e=>{
   if(innerWidth<=860)return;
   e.preventDefault();e.stopPropagation();
   const r=pixelizeWindow(),dir=handle.dataset.resize;
   cornerResize={id:e.pointerId,dir,startX:e.clientX,startY:e.clientY,left:r.left,top:r.top,width:r.width,height:r.height,handle};
   handle.setPointerCapture(e.pointerId);win.classList.add("resizing","no-anim");
 });
 handle.addEventListener("pointermove",e=>{
   if(!cornerResize||e.pointerId!==cornerResize.id)return;
   cornerPending={x:e.clientX,y:e.clientY};
   if(cornerRAF)return;
   cornerRAF=requestAnimationFrame(()=>{
     cornerRAF=0;if(!cornerPending||!cornerResize)return;
     const c=cornerResize,dx=cornerPending.x-c.startX,dy=cornerPending.y-c.startY,dir=c.dir;
     const minW=680,minH=500;
     let left=c.left,top=c.top,w=c.width,h=c.height;
     if(dir.includes("e"))w=clamp(c.width+dx,minW,innerWidth-c.left);
     if(dir.includes("s"))h=clamp(c.height+dy,minH,innerHeight-c.top);
     if(dir.includes("w")){
       w=clamp(c.width-dx,minW,c.left+c.width);
       left=c.left+(c.width-w);
     }
     if(dir.includes("n")){
       h=clamp(c.height-dy,minH,c.top+c.height);
       top=c.top+(c.height-h);
     }
     left=clamp(left,0,Math.max(0,innerWidth-w));top=clamp(top,0,Math.max(0,innerHeight-h));
     win.style.left=Math.round(left)+"px";win.style.top=Math.round(top)+"px";
     win.style.width=Math.round(w)+"px";win.style.height=Math.round(h)+"px";win.style.transform="none";
     cornerPending=null;
   });
 });
 const finish=e=>{
   if(!cornerResize||e.pointerId!==cornerResize.id)return;
   cornerResize=null;win.classList.remove("resizing");setTimeout(()=>win.classList.remove("no-anim"),20);
   const r=win.getBoundingClientRect();
   state.size="custom";state.dim={width:Math.round(r.width),height:Math.round(r.height)};
   state.pos={left:Math.round(r.left),top:Math.round(r.top)};save();
   emit("setting",{key:"windowSize",value:"custom",width:state.dim.width,height:state.dim.height});
 };
 handle.addEventListener("pointerup",finish);handle.addEventListener("pointercancel",finish);
});

},{passive:true});

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously,
  signOut as firebaseSignOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getDatabase, ref, set, get, onValue
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const defaults={
  apiKey:"AIzaSyCkph0lcF4gNRhtcXosBjTYVbXgNBZF0CE",
  authDomain:"macos-tahoe.firebaseapp.com",
  projectId:"macos-tahoe",
  databaseURL:"https://macos-tahoe-default-rtdb.asia-southeast1.firebasedatabase.app",
  storageBucket:"macos-tahoe.firebasestorage.app",
  messagingSenderId:"1092066362651",
  appId:"1:1092066362651:web:cb57d9da6622274e913fbe",
  measurementId:"G-4X8P8F3QV9"
};
const localCfg=window.TahoeAdmin?.config?.().firebase||{};
const cfg={...defaults,...Object.fromEntries(Object.entries(localCfg).filter(([,v])=>v))};
const app=getApps().length?getApps()[0]:initializeApp(cfg);
const auth=getAuth(app),db=getDatabase(app),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
let unsubGlobal=null,unsubFiles=null,refreshTimer=null;

const cleanPath=p=>String(p||"").replace(/^\/+|\/+$/g,"");
const globalPath=()=>cleanPath(window.TahoeAdmin?.config?.().firebase?.globalPath||"adminDashboard/global");
const filesPath=()=>cleanPath(window.TahoeAdmin?.config?.().firebase?.filePath||"adminDashboard/files");

function stateNow(){try{return window.TahoeAdmin?.state?.()||{settings:{}}}catch{return {settings:{}}}}
function stopSubscriptions(){
  if(unsubGlobal){unsubGlobal();unsubGlobal=null}
  if(unsubFiles){unsubFiles();unsubFiles=null}
}
function refreshSubscriptions(){
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(()=>{
    stopSubscriptions();
    const s=stateNow(),user=auth.currentUser;
    if(!user||s.settings?.realtimeSync===false)return;
    if(s.settings?.syncScope==="global"){
      unsubGlobal=onValue(ref(db,globalPath()),snap=>{
        const v=snap.val();
        if(v&&window.TahoeAdmin?.applyGlobalData)window.TahoeAdmin.applyGlobalData(v);
      },e=>window.TahoeAdmin?.toast?.(e.message||"Global realtime sync failed"));
    }
    if(s.settings?.autoFileSync){
      unsubFiles=onValue(ref(db,filesPath()),snap=>{
        const v=snap.val();
        if(v?.items&&window.TahoeAdmin?.applyFinderData)window.TahoeAdmin.applyFinderData(v);
      },e=>window.TahoeAdmin?.toast?.(e.message||"File realtime sync failed"));
    }
  },120);
}
async function signInGoogle(){
  if(location.protocol==="file:")throw new Error("Google sign-in needs localhost or HTTPS. Open this page from localhost, macos-tahoe.web.app, or thythet.com.");
  return (await signInWithPopup(auth,provider)).user;
}
async function signInAnon(){
  return (await signInAnonymously(auth)).user;
}
async function writeGlobal(data){
  if(!auth.currentUser)throw new Error("Sign in to Firebase first.");
  await set(ref(db,globalPath()),data);return data;
}
async function readGlobal(){
  if(!auth.currentUser)throw new Error("Sign in to Firebase first.");
  const snap=await get(ref(db,globalPath()));return snap.exists()?snap.val():null;
}
async function writeFiles(data){
  if(!auth.currentUser)throw new Error("Sign in to Firebase first.");
  await set(ref(db,filesPath()),data);return data;
}
async function readFiles(){
  if(!auth.currentUser)throw new Error("Sign in to Firebase first.");
  const snap=await get(ref(db,filesPath()));return snap.exists()?snap.val():null;
}

window.TahoeFirebase={
  app,auth,db,
  signInGoogle,
  signInAnonymous:signInAnon,
  signOut:()=>firebaseSignOut(auth),
  writeGlobal,readGlobal,writeFiles,readFiles,
  refreshSubscriptions,
  currentUser:()=>auth.currentUser
};

window.addEventListener("tahoe-state-saved",refreshSubscriptions);
window.TahoeAdmin?.setFirebaseReady?.(true);

onAuthStateChanged(auth,async user=>{
  if(user){
    try{window.TahoeAdmin?.setFirebaseToken?.(await user.getIdToken())}catch{}
    window.TahoeAdmin?.setAuthUser?.(user);
  }else{
    window.TahoeAdmin?.setFirebaseToken?.("");
    window.TahoeAdmin?.clearGoogleUser?.();
  }
  refreshSubscriptions();
});
</script>
