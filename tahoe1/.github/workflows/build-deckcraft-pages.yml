name: Build Tahoe + DeckCraft Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.95 + WASM target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install wasm-opt
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: deckcraft-src

      - name: Build DeckCraft Web into Tahoe
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf apps/deckcraft-web
          mkdir -p apps/deckcraft-web
          cd deckcraft-src/apps/deckcraft-web
          trunk build --release
          test -f ../../../apps/deckcraft-web/index.html
          find ../../../apps/deckcraft-web -maxdepth 1 -type f -print

      - name: Upload compiled DeckCraft artifact
        uses: actions/upload-artifact@v4
        with:
          name: deckcraft-web
          path: apps/deckcraft-web

      - name: Validate Tahoe payload
        shell: bash
        run: |
          set -euxo pipefail
          test "$(find data/books -maxdepth 1 -name '*.json' | wc -l)" -eq 66
          test -f apps/deckcraft-web/index.html
          if find . -path './deckcraft-src' -prune -o -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) -print | grep -q .; then
            echo 'Font binary found outside deckcraft-src; stopping.'
            exit 1
          fi

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'deckcraft-src/' \
            --exclude '*.zip'
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
