<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerSlidePro — Audience Screen</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui,sans-serif}
#screen{width:100%;height:100%;border:0;display:block;background:#000}
#launch{position:fixed;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;background:#111d}
#card{max-width:370px;margin:20px;padding:24px;border:1px solid #474747;border-radius:13px;background:#222;text-align:center;box-shadow:0 20px 60px #000a}
#card h1{font-size:18px;margin:0 0 12px}#message{font-size:12px;color:#ccd0d5;margin:12px 0}
button{background:#ed7741;border:0;border-radius:8px;padding:11px 17px;font:600 14px system-ui;color:#fff;cursor:pointer}
#actions{position:fixed;right:10px;bottom:10px;display:flex;gap:8px;z-index:6;opacity:0;transition:opacity .15s}
#actions:hover,#actions:focus-within{opacity:1}#actions button{font-size:11px;padding:6px 9px;background:#3339}
@media(pointer:coarse){#actions{opacity:.8}}
</style>
</head>
<body>
<iframe id="screen" title="Audience slides" allow="fullscreen" allowfullscreen src="../apps/deckcraft-web/index.html?blank&audience=1&v=77dualmonitor"></iframe>
<div id="launch"><section id="card"><h1>PowerSlidePro · Audience Screen</h1><p id="message">Preparing the audience presentation…</p><button id="fullscreen" type="button">Enter Full Screen</button></section></div>
<div id="actions"><button id="fs-again" type="button">Fullscreen</button><button id="exit" type="button">End Show</button></div>
<script>
(()=>{
'use strict';
const origin=location.origin, iframe=document.getElementById('screen');
const status=document.getElementById('message');
const display=document.getElementById('launch');
const notify=(type,info={})=>{
 try{if(window.opener&&!window.opener.closed)window.opener.postMessage({type,...info},origin)}catch{}
};
let contentLoaded=false,latest=null;
function toSlide(data){iframe.contentWindow?.postMessage(data,origin)}
function retry(){notify('pspro-audience-ready')}
window.addEventListener('message',event=>{
 if(event.origin!==origin)return;
 const data=event.data||{};
 if(event.source===window.opener){
   if(data.type==='pspro-audience-data'){
     latest=data;
     if(contentLoaded)toSlide({type:'tahoe-deckcraft-audience-load',
       name:data.name||'Audience.deckcraft',data:data.data,index:String(data.index||0)});
     status.textContent='Loading slideshow…';
   }
   if(data.type==='pspro-audience-error'){
     status.textContent=data.message||'Could not export presentation.';
   }
   if(data.type==='pspro-audience-state'){
     if(contentLoaded)toSlide({type:'tahoe-deckcraft-audience-state',
       index:String(data.index||0),blank:data.blank||''});
   }
   if(data.type==='pspro-audience-end')window.close();
 }else if(event.source===iframe.contentWindow&&data.type==='tahoe-deckcraft-audience'){
   switch(data.action){
     case 'ready':
       contentLoaded=true;
       if(latest)toSlide({type:'tahoe-deckcraft-audience-load',
         name:latest.name,data:latest.data,index:String(latest.index||0)});
       retry();
       break;
     case 'loaded':
       status.textContent='Presentation ready.';
       display.style.display='none';
       iframe.focus();break;
     case 'error':
       status.textContent='Could not open slides: '+(data.data||'Please retry.');break;
     case 'state':
       notify('pspro-audience-control',{index:data.index,blank:data.blank||''});break;
     case 'end':
       notify('pspro-audience-control',{end:true});break;
   }
 }
});
document.getElementById('fullscreen').onclick=async()=>{
 try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}
 catch(e){status.textContent='Fullscreen was blocked; maximize or move this window, then try again.'}
};
document.getElementById('fs-again').onclick=async()=>{
 try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch{}
};
document.getElementById('exit').onclick=()=>{notify('pspro-audience-control',{end:true});window.close()};
window.addEventListener('beforeunload',()=>notify('pspro-audience-closed'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.fullscreenElement){document.exitFullscreen().catch(()=>{})}});
// Wait for the audience WASM renderer to report readiness; avoid duplicate loads.
})();
</script>
</body>
</html>
