<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PowerSlidePro</title>
  <script>
    (() => {
      const showError = (message) => {
        const el = document.getElementById("deckcraft_loading");
        if (!el) return;
        el.style.pointerEvents = "auto";
        el.style.padding = "24px";
        el.style.textAlign = "center";
        el.style.whiteSpace = "pre-wrap";
        el.textContent = "PowerSlidePro startup error\n\n" + String(message);
      };
      window.addEventListener("error", (event) => {
        showError(event.error?.stack || event.message || "Unknown JavaScript error");
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        showError(reason?.stack || reason?.message || reason || "Unhandled promise rejection");
      });
      window.setTimeout(() => {
        const el = document.getElementById("deckcraft_loading");
        if (el && el.isConnected && el.textContent.includes("Loading PowerSlidePro")) {
          el.textContent = "PowerSlidePro is taking too long to start.\nThe renderer or WebAssembly startup may have failed.";
        }
      }, 20000);
    })();
  </script>
  
  <script src="./font-manager.js" defer></script>
  
<script type="module">

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
